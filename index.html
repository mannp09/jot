  const meta = document.createElement("span"); meta.className = "section-sub"; meta.textContent = sub || "";
  const chevron = document.createElement("span"); chevron.className = "section-chevron"; chevron.innerHTML = I["chevron-down"];
  const panel = document.createElement("div"); panel.className = "libpanel";
  summary.append(title, meta, chevron); details.append(summary, panel);
  details.addEventListener("toggle", () => { libView.sections[key] = details.open; });
  return { details, panel };
}

/* the page label lives in the BODY now - the bar is the mirrored header and
   never changes. Every renderer names its page with this. */
function libHeading(text){
  const h = document.createElement("div");
  h.className = "libpagetitle"; h.textContent = text;
  libBody.appendChild(h);
}

function renderLib(){
  const s = load();
  /* ★★ SORT ON THE NEWEST ENTRY, NOT ON WHEN THE JOT WAS OPENED. His report
     2026-08-15: "loose does just have 10:17 - it needs to updated to show
     newest jots with time stamps."

     A jot is CONTINUOUS - one per category per day - so THOUGHTS opened at
     10:17am and was still being written into at 9:05pm. Sorting and stamping
     on `opened_at` froze it at breakfast and buried the evening entry under a
     1:35pm food note. ⚠ The bug is a direct consequence of the continuous-jot
     model and it appeared the first day he used the app for a full day. */
  const nImported = s.jots.reduce((n, j) => n + (isImported(j) ? 1 : 0), 0);
  const all = viewJots(s.jots).slice().sort((a,b) => newestTs(b).localeCompare(newestTs(a)));
  const w = all.reduce((a,j) => a + words(j), 0);
  libBody.innerHTML = "";
  libHeading(demoActive() ? "JOHN DOE · DEMO" : "LIBRARY");

  /* LIBRARY_ACCORDION_START
     ★ Slimmed in the 8/20 redesign: the library is for READING. Account,
     Import/Export, the journal archive and the demo entry moved to the drawer
     and the Account page; day-part naming lives on the clickable day-part in
     every header. What remains is the corpus and the ways into it. */
  const stack = document.createElement("div"); stack.className = "libstack";

  if (demoActive()){
    const profile = createLibrarySection("Profile", "FICTIONAL · READ ONLY", "profile");
    const card = document.createElement("div"); card.className = "demo-profile";
    card.innerHTML = '<b>John Doe</b><span>Born Jan 1, 2001 · Grew up in New Jersey</span><span>5 years · Aug 5, 2021 to Aug 4, 2026</span>';
    const note = document.createElement("div"); note.className = "demo-note";
    note.textContent = "Fictional demo. Search, filters, reading, and Patterns work; writing and data changes are off.";
    const exit = document.createElement("button"); exit.className = "mrow danger";   /* red: it leaves the demo (ruled 8/20) */
    exit.innerHTML = '<span>Exit demo</span><span class="sub">RETURN TO YOUR LOCAL JOTS</span>';
    exit.onclick = () => exitDemo(true);
    profile.panel.append(card, note, exit);
    stack.appendChild(profile.details);
  }

  const search = createLibrarySection("Search", libView.q ? "FILTERING" : "EVERY JOT", "search");
  const sb = document.createElement("input");
  sb.className = "srch"; sb.type = "search"; sb.value = libView.q;
  sb.placeholder = "search every jot"; sb.setAttribute("aria-label", "Search every jot");
  sb.oninput = () => {
    clearTimeout(sb._t);
    sb._t = setTimeout(() => {
      libView.q = sb.value.trim().toLowerCase(); renderLib();
      const next = libBody.querySelector(".srch");
      if (next){ next.focus(); next.setSelectionRange(next.value.length, next.value.length); }
    }, 150);
  };
  search.panel.appendChild(sb); stack.appendChild(search.details);

  libBody.appendChild(stack);

  /* the three-number pulse stays glanceable; the full read is one tap away */
  const daysWritten = new Set(all.map(jot => vector(jot).date)).size;
  const peek = document.createElement("button");
  peek.type = "button"; peek.className = "patternpeek"; peek.title = "Open patterns";
  for (const [value, label] of [[all.length,"JOTS"],[w,"WORDS"],[daysWritten,"DAYS"]]){
    const cell = document.createElement("div"); cell.innerHTML = `<b>${value}</b><span>${label}</span>`; peek.appendChild(cell);
  }
  peek.onclick = renderStats;
  libBody.appendChild(peek);
  /* LIBRARY_ACCORDION_END */

  const timelineHeading = libraryTimelineHeading(demoActive(), all.length);
  if (timelineHeading){
    const heading = document.createElement("div"); heading.className = "library-timeline-heading";
    const title = document.createElement("b"); title.textContent = timelineHeading.title;
    const meta = document.createElement("span"); meta.textContent = timelineHeading.meta;
    heading.append(title, meta); libBody.appendChild(heading);
  }

  if (!all.length){
    const empty = document.createElement("div");
    empty.className = "empty"; empty.textContent = "No jots yet. Close this and tap a prompt.";
    libBody.appendChild(empty); return;
  }

  /* --- the grouping selector ---------------------------------------------- */
  /* ★★ THREE FILTER ROWS. Time picks the grouping; category and window narrow
     what lands in it. They stack, which is the entire point - "food, evening,
     by month" was unaskable when these were one exclusive row. */
  /* ★★★ TWO CONTROLS, NOT THREE COPIES OF ONE. 2026-08-15, his words:
     "identify what time category and window are - dropdowns or selectable idk
     the word for it."

     The words are SEGMENTED CONTROL and FILTER CHIPS, and they are different
     because the two jobs are different:

       TIME  -> a SEGMENTED CONTROL. Exactly one is always active, the set is
                small and fixed, and picking one RESTRUCTURES the whole tree.
                Drawn as one connected track with equal segments, which is the
                shape that says "pick one of these, one is always on".
       CAT   -> FILTER CHIPS. Optional, default ALL, and they NARROW what is
       WINDOW   already there rather than rebuilding it. Drawn as separate
                pills with a tick when active, which is the shape that says
                "these are off until you turn them on".

     ⚠ Before today all three rendered identically, so nothing on screen told
     him that Time behaves differently from the other two. That is the real
     reason the library did not read as an app: the controls were honest about
     their values and silent about their KIND. */
  let bar;   /* the sticky filter bar; assigned just before the rows are built */
  const filterRow = (title, opts, current, onPick, kind) => {
    const wrap = document.createElement("div");
    wrap.className = "frow" + (kind === "seg" ? " isseg" : "");
    const lab = document.createElement("div");
    lab.className = "flab"; lab.textContent = title;
    const strip = document.createElement("div");
    strip.className = kind === "seg" ? "seg" : "views";
    strip.setAttribute("role", kind === "seg" ? "tablist" : "group");
    strip.setAttribute("aria-label", title);
    for (const [val, text] of opts){
      const c = document.createElement("button");
      c.type = "button";
      const on = current === val;
      c.className = (kind === "seg" ? "segbtn" : "vchip") + (on ? " on" : "");
      /* the tick is the chip's whole grammar - it says this one is APPLIED.
         A segment never gets one: something is always selected there, so a
         tick on every render would carry no information. */
      c.innerHTML = (kind !== "seg" && on ? I.check : "") + "<span></span>";
      c.querySelector("span").textContent = text;
      c.setAttribute("aria-pressed", on);
      if (kind === "seg") c.setAttribute("aria-selected", on);
      c.onclick = () => { onPick(val); libView.seeded = null; libView.open.clear(); renderLib(); };
      strip.appendChild(c);
    }
    wrap.append(lab, strip);
    /* ⚠ deliberately the closure variable, NOT a property parked on libBody.
       renderJot wipes libBody.innerHTML without clearing such a property, so a
       stashed pointer would survive as a DETACHED node and the next filter row
       would render into nothing. Same silent-break shape as the delete button
       that was built and never appended. */
    bar.appendChild(wrap);
    /* ⚠⚠ NO AUTO-SCROLL. Every value is on screen now, so there is nothing to
       scroll to - and the scroll WAS the problem. Re-centring the active chip
       on every render made the row jump under his thumb between taps, which is
       the shake he described. A control that moves while you are using it is
       worse than one that needs a swipe. */
  };

  /* ★★★ A COLLAPSIBLE FILTER PANEL BEHIND A STICKY SUMMARY.
     ⚠⚠ MEASURED, NOT GUESSED: the three rows fully expanded are 534px on an
     812px screen. Making THAT sticky pinned 66% of the viewport and pushed
     every result below the fold - worse than the web layout it replaced.

     ★ So the sticky element is a 44px SUMMARY that always says what is
     applied ("MONTH · FOOD · ALL"), and the chips live in a panel behind it.
     This is the Spotify-library pattern and it satisfies his constraint
     exactly: when the panel is open EVERYTHING IS PRESENT and nothing
     scrolls sideways - his 8/14 ruling - and when it is shut he gets his
     screen back. */
  const sum = document.createElement("button");
  sum.type = "button";
  sum.className = "fsum" + (libView.fopen ? " open" : "");
  sum.setAttribute("aria-expanded", String(!!libView.fopen));
  const applied = [GROUPINGS[libView.group].label,
                   libView.cat === "all" ? "ALL" : label(libView.cat),
                   libView.part === "all" ? "ALL" : libView.part.toUpperCase()];
  sum.innerHTML = '<span class="fsl">FILTERS</span><span class="fsv"></span>' +
                  '<span class="fsc">' + I["chevron-down"] + '</span>';
  sum.querySelector(".fsv").textContent = applied.join("  ·  ");
  sum.onclick = () => { libView.fopen = !libView.fopen; renderLib(); };
  libBody.appendChild(sum);

  bar = document.createElement("div");
  bar.className = "filterbar" + (libView.fopen ? "" : " shut");
  libBody.appendChild(bar);

  /* ⚠⚠ THE FILTERED SET IS COMPUTED HERE, BEFORE THE TIME PICKER IS DRAWN, and
     the order is load-bearing. autoGroup() may change `libView.group`, and the
     picker below renders whichever level is selected - so if the picker were
     drawn first it would highlight DAY while the tree underneath rendered
     MONTH. ★ A control that misreports the current state is worse than no
     control, because he would tap MONTH, see no change, and conclude it is
     broken. Compute -> decide -> draw. */
  const jots = all.filter(j => hits(j, libView.q))
    .filter(j => libView.cat === "all" || j.category === libView.cat)
    .filter(j => libView.part === "all" || vector(j).daypart === libView.part);

  /* ★★ derive the level from what is actually being shown - `jots`, AFTER the
     filters, not `all`. Filtering to one category can turn 939 days into 40,
     at which point DAY is the right view again and forcing MONTH would hide
     detail for no reason. The view follows the data in both directions. */
  if (libView.groupAuto){
    const want = autoGroup(jots);
    if (want !== libView.group){ libView.group = want; libView.seeded = null; }
  }

  /* ★ picking a level by hand turns the automatic default OFF for good. The
     derived default is a starting point, never an override of his choice -
     if he wants DAY across five years that is his call and it must stick. */
  filterRow("Time", Object.entries(GROUPINGS).map(([k, g]) => [k, g.label]),
            libView.group, v => { libView.group = v; libView.groupAuto = false; }, "seg");
  filterRow("Category", [["all","ALL"], ...allCategoryIds().map(c => [c, label(c)])],
            libView.cat, v => libView.cat = v, "chip");
  filterRow("Window", [["all","ALL"], ...DAYPARTS.map(p => [p[1],
              showingFun() ? p[2].toUpperCase() : p[1].toUpperCase()])],
            libView.part, v => libView.part = v, "chip");

  /* --- the vector tree ---------------------------------------------------
     ★★★ Picking a grouping picks the ROOT of the address, not a flat bucket.
     MONTH gives AUG 2026, which opens into weeks, which open into days, which
     open into jots. Nothing extra is stored to do this: it is the same GROUP
     BY as before, nested down the chain the schema already writes. */
  /* ⚠ all three axes AND the search apply before anything is grouped, so every
     count and every bar below is post-filter. A header saying 9 while a filter
     is on would be lying about what is underneath it. */
  const G = GROUPINGS[libView.group];
  /* seed once per grouping: everything collapsed, today's chain open */
  if (libView.seeded !== libView.group){
    libView.seeded = libView.group;
    currentChain(G.level).forEach(p => libView.open.add(p));
  }

  const cap = document.createElement("div");
  cap.className = "empty";
  const on = [];
  if (libView.cat !== "all")  on.push(label(libView.cat));
  if (libView.part !== "all") on.push(libView.part.toUpperCase());
  if (libView.q)              on.push('"' + libView.q + '"');
  cap.textContent = jots.length + (jots.length === 1 ? " jot" : " jots")
    + (on.length ? "  \u00b7  " + on.join("  \u00b7  ") : "")
    + (jots.length !== all.length ? "  \u00b7  of " + all.length : "");
  /* ★★ THE MASTER ±, his ask that it exist "throughout whole database
     architecture". Same affordance at the root as on every node, so there is
     no level of the tree where the gesture stops working. */
  const capRow = document.createElement("div");
  capRow.className = "caprow";
  capRow.appendChild(cap);
  libBody.appendChild(capRow);
  if (!jots.length) return;

  const jotRow = j => {
    const v = vector(j);
    const b = document.createElement("button");
    b.className = "jrow"; b.type = "button";
    /* the stamp is the LATEST entry, and the preview leads with it - the list
       answers "what did I write most recently", not "when did this start". */
    const n = j.paragraphs.length;
    const span = n > 1
      ? "  \u00b7  " + n + " ENTRIES from " + clk(new Date(j.opened_at))
      : "";
    b.innerHTML = `<div class="t">${clk(new Date(newestTs(j)))}</div>
      <div><div class="cat">${label(v.category)} &nbsp;&#183;&nbsp; ${showingFun() ? v.fun : v.daypart.toUpperCase()}${span}</div>
      <div class="pv"></div></div>`;
    b.querySelector(".pv").textContent =
      j.paragraphs.slice().reverse().map(p => p.text).join("  \u00b7  ");
    b.addEventListener("click", () => renderJot(j));
    return b;
  };

  /* one collapsible header. `path` makes the open/shut state unique per node,
     so AUG 2026 and AUG 2025 do not toggle each other. */
  /* every descendant path under a node, so one button can open or close a
     whole branch. Derived from the rows themselves, never guessed. */
  function subPaths(rows, li, path){
    /* ⚠ OFF BY ONE. This returned [] one level too early, so WEEK got no
       expand-all even though it holds days. The last level with descendants
       is the one BEFORE day, and day itself holds jots rather than paths. */
    if (li > CHAIN.length - 1) return [];
    const out = [], seen = new Map();
    for (const j of rows){
      const v = vector(j), k = lvlKey[CHAIN[li]](v);
      if (!seen.has(k)) seen.set(k, []);
      seen.get(k).push(j);
    }
    for (const [k, kidRows] of seen){
      const p = path + "/" + k;
      out.push(p, ...subPaths(kidRows, li + 1, p));
    }
    return out;
  }

  const header = (path, text, n, w, frac, depth, rows, li) => {
    const open = libView.open.has(path);
    const h = document.createElement("div");
    h.className = "grp d" + depth + (open ? "" : " shut");

    const main = document.createElement("button");
    main.type = "button"; main.className = "gmain";
    main.setAttribute("aria-expanded", String(open));
    main.innerHTML =
      '<span class="car">' + I["chevron-down"] + '</span>' +
      '<span class="gk"></span>' +
      '<span class="gn">' + n + " &#183; " + w + 'W</span>' +
      '<span class="bar"><i style="width:' + (frac * 100).toFixed(1) + '%"></i></span>';
    main.querySelector(".gk").textContent = text;
    main.onclick = () => {
      open ? libView.open.delete(path) : libView.open.add(path);
      renderLib();
    };
    h.appendChild(main);

    /* ★ his plus: opens this node AND everything under it. Pressed again it
       closes the whole branch. Only appears where there IS a branch. */
    /* ★ EVERY header gets one, his ask: "each one needs to have expand and
       collapse in the dropdowns." Where there is a branch it opens the whole
       branch; at the day level, where the children are jots rather than
       paths, it opens that day. The gesture never stops working as you go
       deeper, which was the point of asking for it throughout. */
    /* ⚠⚠ LAZY ON PURPOSE. subPaths() walks every descendant row, so calling it
       for every header made the render O(rows x depth) - measured 2026-08-16 on
       a simulated 10-year corpus at 425ms, WORSE than the old flat day list
       (244ms) even though this build makes 72x fewer DOM nodes.

       ★ The saving is free, not a trade: `allOpen` below is `open && ...`, so
       for a COLLAPSED node the answer is false no matter what its children are.
       Collapsed nodes are the overwhelming majority at every scale, and they
       were each paying for a full subtree traversal to compute a value that
       could not have been anything but false. The click handler still needs the
       real list, so it computes it then - once, on demand, for one node. */
    const kidsOf = () => subPaths(rows, li + 1, path);
    {
      const allOpen = open && kidsOf().every(p => libView.open.has(p));
      const x = document.createElement("button");
      x.type = "button"; x.className = "gall" + (allOpen ? " on" : "");
      x.setAttribute("aria-label", allOpen ? "Collapse all under " + text
                                           : "Expand all under " + text);
      x.innerHTML = allOpen ? I["minus"] : I["plus"];
      x.onclick = e => {
        e.stopPropagation();
        const kids = kidsOf();          /* the one place the full walk is owed */
        if (allOpen){ libView.open.delete(path); kids.forEach(p => libView.open.delete(p)); }
        else { libView.open.add(path); kids.forEach(p => libView.open.add(p)); }
        renderLib();
      };
      h.appendChild(x);
    }
    return { h, shut: !open };
  };

  const wordsOf = rows => rows.reduce((a, j) => a + words(j), 0);

  /* recurse down the chain from the chosen level to `day`, then the jots */
  function walk(rows, li, path, depth, container){
    const level = CHAIN[li];
    const buckets = new Map();
    for (const j of rows){
      const v = vector(j), k = lvlKey[level](v);
      if (!buckets.has(k)) buckets.set(k, { label: lvlLabel[level](v), rows: [] });
      buckets.get(k).rows.push(j);
    }
    const keys = [...buckets.keys()].sort().reverse();          /* newest first */
    const peak = Math.max(1, ...keys.map(k => buckets.get(k).rows.length));

    for (const k of keys){
      const node = buckets.get(k), p = path + "/" + k;
      const { h, shut } = header(p, node.label, node.rows.length,
                                 wordsOf(node.rows), node.rows.length / peak,
                                 depth, node.rows, li);
      container.appendChild(h);
      if (shut) continue;
      const kid = document.createElement("div");
      kid.className = "kids d" + depth;
      container.appendChild(kid);
      if (li < CHAIN.length - 1) walk(node.rows, li + 1, p, depth + 1, kid);
      else node.rows.forEach(j => kid.appendChild(jotRow(j)));
    }
  }

  /* ⚠ every grouping is a time level now, so the flat branch is gone. Category
     and window stopped being groupings the moment they became filters. */
  const allPaths = subPaths(jots, CHAIN.indexOf(G.level), G.level);
  const everythingOpen = allPaths.length > 0 && allPaths.every(p => libView.open.has(p));
  if (allPaths.length){
    const m = document.createElement("button");
    m.type = "button"; m.className = "gall master" + (everythingOpen ? " on" : "");
    m.setAttribute("aria-label", everythingOpen ? "Collapse everything" : "Expand everything");
    m.innerHTML = everythingOpen ? I["minus"] : I["plus"];
    m.onclick = () => {
      if (everythingOpen) libView.open.clear();
      else allPaths.forEach(p => libView.open.add(p));
      renderLib();
    };
    capRow.appendChild(m);
  }

  walk(jots, CHAIN.indexOf(G.level), G.level, 0, libBody);
}

/* one jot, its full text, and every bucket it is filed under */
/* ★★ SUGGESTED BUCKET for THOUGHTS jots. His spec 2026-08-15: "we can work on
   loose given suggested bucket based on all available buckets (not hardcoded
   but whats available at that time)... let user have final say to sort."

   The lexicon is built AT CALL TIME from two live sources: each bucket's own
   prompt text (cold start) and the words of jots ALREADY FILED in that bucket
   - so it is exactly "whats available at that time", learns his vocabulary as
   the corpus grows, and knows nothing that is not already in the store.
   ⚠ NOTHING IS WRITTEN until he taps the tag - a suggestion is computed on
   render and discarded; the phantom-jot fence covers categories too. */
/* ★ the stamp of the LAST thing he wrote in this jot, falling back to when it
   was opened for a jot with nothing in it yet. Function declaration on purpose:
   it is called from renderLib's sort, which runs before this point in the file. */
function newestTs(j){
  const ps = j.paragraphs;
  return (ps && ps.length ? ps[ps.length - 1].ts : null) || j.opened_at;
}

/* a pause, in the units a person would say it in */
function dur(s){
  if (s < 90) return s + "s";
  const m = Math.round(s / 60);
  if (m < 90) return m + "m";
  const h = Math.floor(m / 60), r = m % 60;
  if (h < 24) return r ? h + "h " + r + "m" : h + "h";
  return Math.floor(h / 24) + "d " + (h % 24) + "h";
}

const STOPW = new Set(("the a an and or but to of in on at for with is are was were i my me it its this that today im am be so not no just really very have has had do did done will would about more some you your then than when while well also got get "
 + "went into out up down over back again still even much many lot").split(" "));

/* ⚠ THE COLD START, found by testing rather than by reading. Built from the
   prompts alone, the suggester scored ZERO on "ate chicken and rice" - the
   prompt says "eat", the sentence says "ate", and with an empty corpus there
   was nothing else to match. A suggester that suggests nothing for a month is
   a dead feature.
   ★ So each bucket gets a small opening vocabulary, weighted 1 - HALF what a
   word from his own filed jots scores. The prior gets the feature working on
   day one and is progressively outvoted by how HE actually writes. Keyed off
   DECK, so a bucket with no seed simply learns from scratch. */
const SEED = {
  food:   "ate eat eating meal lunch dinner breakfast snack calories protein carbs hungry coffee water drank cooked pizza rice chicken",
  body:   "squats bench lift lifted run ran running workout gym reps sets sore stretch weight cardio drenched tired legs",
  /* ⚠ "spoke" was missing and it is one of the commonest ways he opens a
     social entry - "just spoke with <a name>" scored too low to suggest
     anything. Found by testing against his own sentences, not by imagining
     what a social jot looks like. */
  social: "saw met meet meeting talked talk talking spoke speak speaking called "
        + "call texted text friend friends family mum mom dad brother sister "
        + "dinner hung hangout visit visiting conversation together nice",
  work:   "built building code app project shipped fixed wrote job apply interview resume client deploy feature",
  gratitude: "grateful thankful appreciate lucky glad gift blessed",
  avoid:  "avoiding avoided procrastinating putting off should scared afraid dodging skipped ignoring",
  fulfillment: "count counted mattered proud accomplished progress win day worth meaningful"
};
const toks = s => (String(s).toLowerCase().match(/[a-z']+/g) || [])
  .filter(w => w.length > 2 && !STOPW.has(w));
/* one lexicon per bucket, built once per store version.
   ⚠ Weights are unchanged and deliberately so: the prior (prompt + label +
   seed) scores 1, HIS OWN filed words score 2, so how he actually writes
   outvotes what I guessed 2:1 and does so more as the corpus grows. */
let _lexCache = null;
function lexicons(){
  if (_lexCache && _lexCache.gen === STORE_GEN) return _lexCache.v;
  const all = ownJots(load().jots), out = {};   /* never toggle-aware: this seeds live prompts */
  for (const cat of DECK){
    if (cat === "plus") continue;
    const lex = new Map();
    for (const w of toks(PROMPTS[cat] + " " + label(cat) + " " + (SEED[cat] || "")))
      lex.set(w, (lex.get(w) || 0) + 1);
    out[cat] = lex;
  }
  /* ★ ONE pass over the corpus instead of one pass PER CATEGORY - the old
     loop read every jot seven times to build seven lexicons. */
  for (const o of all){
    const lex = out[o.category];
    if (!lex) continue;
    for (const p of o.paragraphs)
      for (const w of toks(p.text)) lex.set(w, (lex.get(w) || 0) + 2);
  }
  _lexCache = { gen: STORE_GEN, v: out };
  return out;
}

function suggest(j){
  if (j.category !== "plus") return null;
  const mine = new Set(j.paragraphs.flatMap(p => toks(p.text)));
  if (!mine.size) return null;
  /* ★★ THE LEXICON IS CACHED PER STORE VERSION. It was rebuilt from the ENTIRE
     corpus across all seven categories every time a jot detail opened -
     measured 182ms at 5,000 jots on DESKTOP, so multiples of that on a phone,
     on a tap that is supposed to feel instant. It only changes when the store
     changes, so it is keyed on STORE_GEN and built once per change. */
  const lexes = lexicons();
  const scored = [];
  for (const cat of DECK){
    if (cat === "plus") continue;
    const lex = lexes[cat];
    let s = 0; for (const w of mine) s += lex.get(w) || 0;
    if (s) scored.push([cat, s]);
  }
  scored.sort((a, b) => b[1] - a[1]);
  const [best, bestScore] = scored[0] || [null, 0];
  const runnerUp = scored[1] ? scored[1][1] : 0;

  /* ★★★ A TIE MEANS IT DOES NOT KNOW, AND SAYING SO IS THE HONEST ANSWER.
     Found by testing: "squats and bench then a run, drenched" scored FOOD 4
     and BODY 4 - a dead tie - and the old `s > bestScore` handed it to
     whichever category sits earlier in DECK. Food is index 1, body is index 2.
     ⚠ So the suggestion was decided by the ORDER I HAPPENED TO LIST THE
     CATEGORIES IN, and it presented that coin flip to him as a recommendation.
     ★ Same principle as the same-second flag being relabelled: a suggester
     that overclaims is worse than one that stays quiet, because he has to
     spend attention overruling it. It now needs to win by 2 or it says
     nothing. */
  if (bestScore - runnerUp < 2) return null;
  /* below two shared signals the suggester has no business speaking */
  return bestScore >= 2 ? best : null;
}

/* ★★★ PATTERNS — the distribution, which the chips cannot show.
   His own framing 2026-08-14: "user gets to see analysis or conduct analysis
   further." The filter bar answers "show me X"; it cannot answer "when do I
   write, and about what" without eight taps and holding eight counts in your
   head.

   ★★ THE DAYPART HISTOGRAM IS THE ONE THAT EARNS THIS SCREEN, and it earns it
   because of a schema decision: the eight buckets are EQUAL 3-HOUR BLOCKS, so
   a raw count IS A RATE rather than an artifact of bucket width. Unequal
   buckets would make this chart a lie.

   ⚠ Nothing new is stored. Every number here is a reduce over load(), which is
   the payoff of writing the derived columns at insert.
   ⚠ It also serves BOTH readings of what jot is for - measurement wants the
   distribution, re-experiencing wants "the longest I went without writing" -
   so it is safe to build while that question is still his to answer. */
function renderStats(){
  const all = viewJots(load().jots);
  libBody.innerHTML = "";
  libHeading(demoActive() ? "JOHN DOE · PATTERNS" : "PATTERNS");

  const back = document.createElement("button");
  back.className = "mrow"; back.style.marginBottom = "10px";
  back.innerHTML = `<span>&#8592; &nbsp;All jots</span><span class="sub">${all.length} ${all.length===1?"JOT":"JOTS"}</span>`;
  back.onclick = renderLib;
  libBody.appendChild(back);

  if (!all.length){
    const e = document.createElement("div");
    e.className = "empty"; e.textContent = "Nothing to read yet.";
    libBody.appendChild(e); return;
  }

  /* --- the numbers, all derived ------------------------------------------ */
  const byDate = new Map(), byCat = new Map(), byPart = new Map();
  /* ⚠ NOT named `words` - that is the module-level function words(j), and a
     local of the same name shadows it inside this scope. Caught before it ran. */
  let totalWords = 0;
  for (const j of all){
    const v = vector(j), w = words(j);
    totalWords += w;
    byDate.set(v.date, (byDate.get(v.date) || 0) + w);
    byCat.set(v.category, (byCat.get(v.category) || 0) + 1);
    byPart.set(v.daypart, (byPart.get(v.daypart) || 0) + 1);
  }
  const days = [...byDate.keys()].sort();

  /* ⚠ STREAK IS COUNTED BACK FROM TODAY, not "longest run anywhere". A streak
     that already ended is a different fact and would read as current. */
  const dayKey = d => d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate());
  let streak = 0;
  for (let d = new Date(); ; d.setDate(d.getDate() - 1)){
    if (byDate.has(dayKey(d))) streak++;
    else if (streak || dayKey(d) !== dayKey(new Date())) break;  /* today may be blank */
    if (streak > 400) break;
  }

  /* longest pause BETWEEN consecutive entries, corpus-wide */
  const stamps = all.map(j => new Date(newestTs(j))).sort((a,b) => a - b);
  let longest = 0, longestAt = null;
  for (let i = 1; i < stamps.length; i++){
    const g = (stamps[i] - stamps[i-1]) / 1000;
    if (g > longest){ longest = g; longestAt = stamps[i]; }
  }

  const stat = (k, v, sub) => {
    const d = document.createElement("div");
    d.className = "statrow";
    d.innerHTML = `<span class="sk"></span><span class="sv"></span><span class="ss"></span>`;

    d.querySelector(".ss").textContent = sub || "";
    libBody.appendChild(d);
  };
  stat("WORDS", totalWords.toLocaleString(), `${Math.round(totalWords/days.length)} / DAY`);
  stat("DAYS WRITTEN", String(days.length), days[0] ? "SINCE " + days[0] : "");
  stat("CURRENT STREAK", streak + (streak === 1 ? " DAY" : " DAYS"), "COUNTED BACK FROM TODAY");
  if (longest) stat("LONGEST PAUSE", dur(Math.round(longest)),
                    longestAt ? "ENDED " + clk(longestAt) : "");

  /* --- the two distributions --------------------------------------------- */
  const chart = (title, pairs, note) => {
    const h = document.createElement("div");
    h.className = "flab"; h.style.margin = "22px 0 8px";
    h.textContent = title;
    libBody.appendChild(h);
    const max = Math.max(...pairs.map(p => p[1]), 1);
    for (const [name, n] of pairs){
      const r = document.createElement("div");
      r.className = "sbar";
      r.innerHTML = `<span class="sn"></span><span class="bar"><i></i></span><span class="sc"></span>`;
      r.querySelector(".sn").textContent = name;
      r.querySelector(".bar i").style.width = (n / max * 100).toFixed(1) + "%";
      r.querySelector(".sc").textContent = n;
      libBody.appendChild(r);
    }
    if (note){
      const nn = document.createElement("div");
      nn.className = "empty"; nn.style.padding = "8px 2px 0";
      nn.textContent = note;
      libBody.appendChild(nn);
    }
  };

  chart("BY CATEGORY",
        allCategoryIds().filter(c => byCat.get(c)).map(c => [label(c), byCat.get(c)]));

  /* ★ day parts in CLOCK order, never sorted by size - the shape of the day is
     the information, and re-ordering it destroys exactly that. */
  chart("BY WINDOW",
        DAYPARTS.map(p => [showingFun() ? p[2] : p[1].toUpperCase(), byPart.get(p[1]) || 0]),
        "Each window is three hours, so a bar is a rate and not an artifact of bucket width.");
}

/* ★★★ S4 — IMPORT. There was an export and no way back in, which is what made
   every other storage failure PERMANENT rather than annoying. It is also the
   only way to merge the three separate stores he already has: file://,
   localhost, and the phone's LAN IP are three different origins and therefore
   three different corpora.

   ⚠ STRICTLY ADDITIVE, BY CONSTRUCTION. Merge by jot_id, union paragraphs by
   timestamp, and NEVER remove. A replace-all import is Clear-All wearing a
   different label, and he had Clear-All removed for exactly that reason. */
function doImport(file){
  const r = new FileReader();
  r.onload = () => {
    let inc;
    try { inc = JSON.parse(r.result); }
    catch { return alert("That file is not readable JSON. Nothing changed."); }
    if (!inc || !Array.isArray(inc.jots))
      return alert("That file has no jots in it. Nothing changed.");

    const st = load();
    if (STORE_LOCKED) return alert("Writes are paused because the store is "
      + "damaged. Export first, then reload. Nothing changed.");
    /* Prompt definitions merge by immutable id. Local order and visibility
       always win; unknown imported definitions arrive hidden for review. */
    st.prompt_deck = mergePromptDeck(st.prompt_deck, inc.prompt_deck);

    const byId = new Map(st.jots.map(j => [j.jot_id, j]));
    let added = 0, merged = 0;
    /* normalise the incoming file to the SAME shape the store is in, or ids
       will not line up and a re-import silently duplicates. */
    for (const j of splitJots(inc.jots)){
      const cur = byId.get(j.jot_id);
      if (!cur){ st.jots.push(j); byId.set(j.jot_id, j); added++; continue; }
      /* same id: union the paragraphs on timestamp+text, keep both sides */
      const seen = new Set(cur.paragraphs.map(p => p.ts + "␀" + p.text));
      let grew = false;
      for (const p of (j.paragraphs || [])){
        const k = p.ts + "␀" + p.text;
        if (!seen.has(k)){ cur.paragraphs.push(p); seen.add(k); grew = true; }
      }
      if (grew){ cur.paragraphs.sort((a,b) => String(a.ts).localeCompare(String(b.ts))); merged++; }
    }
    if (!save(st)) return;              /* save() already told him why */
    alert("Imported. " + added + " new, " + merged + " merged. "
          + st.jots.length + " jots now on file. Nothing was removed.");
    renderLib();
  };
  r.readAsText(file);
}

function doExport(){
  const s = load();
  if (!s.jots.length) return alert("Nothing to export yet.");
  /* ⚠ STRIP CLIENT-ONLY KEYS. `_open`, `_resumed` and `_editing` are live UI
     state, not record - they were leaking into every export file and then into
     anything that read one. Underscore is the convention for "this belongs to
     the running app", so the filter is the convention rather than a list that
     goes stale. */
  const clean = { ...s, jots: s.jots.map(j => {
    const o = {};
    for (const k in j) if (k[0] !== "_") o[k] = j[k];
    return o;
  })};
  const blob = new Blob([JSON.stringify(clean,null,1)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);

     shipped named the 15th. HIS day is the calendar, so build the stamp from
     local time. Same rule the workspace itself runs on. */
  const d = new Date(), p2e = n => String(n).padStart(2,"0");

  a.click(); URL.revokeObjectURL(a.href);
}

async function sbAuth(path, body){

/* ── STAYING SIGNED IN ──────────────────────────────────────────────────────
   !! HIS ASK: "if loggin stay logged in". Storing the session was NOT enough
   and would have looked fine for about an hour.

   A Supabase access_token EXPIRES (one hour by default). Without a refresh the
   app would sign him out mid-morning with no explanation and no error - the
   worst kind of bug, because nothing appears broken, he is just suddenly
   logged out. The refresh_token is the part that makes "stay logged in" true.

   ! Refresh runs at OPEN and then on a timer, and every failure is silent by
   design: a dead network must never produce a scary modal on a capture app.
   If the refresh cannot happen, he stays signed in locally and sync waits. */
function sbExpired(sess, skewMs){
  if (!sess || !sess.expires_at) return false;
  return (sess.expires_at * 1000) - (skewMs || 60000) < Date.now();
}

async function sbRefresh(){
  const sess = auth.session;
  if (!sess || !sess.refresh_token) return false;
  const res = await sbAuth("token?grant_type=refresh_token",
                           { refresh_token: sess.refresh_token });
  if (res.error){
    /* ! A refresh token is only really dead on an explicit auth failure.
       A network blip must NOT sign him out - that would mean losing the
       session every time he opens the app on a train. */
    if (/invalid|expired|revoked|not found/i.test(res.error)) auth.session = null;
    return false;
  }
  auth.session = res.data;
  return true;
}

async function sbEnsureFresh(){
  if (!auth.signedIn) return false;
  if (!sbExpired(auth.session)) return true;
  return await sbRefresh();

/* ==========================================================================
   SYNC - the mirror. localStorage stays the source of truth ON THIS DEVICE;
   Supabase is a mirror the device pushes to and pulls from. The 8/17 plan,
   followed to the letter. Four properties, each load-bearing:

   1. OFFLINE IS THE APP. Nothing here ever blocks capture. Every entry point
      is a debounced background flush that gives up silently with no network.
   2. ONLY CLOSED JOTS SYNC. The open pad never leaves the device - which
      makes the only genuine conflict jot could have (two devices editing one
      open pad) impossible rather than merely handled.
   3. THE PULL PATH WRITES THROUGH save(), NEVER localStorage.setItem. save()
      is the single writer; the store cache hangs off its generation counter,
      and a second raw writer would mean stale reads with nothing thrown.
   4. A DELETE IS A ROW, NOT AN ABSENCE. `deleted_at` tombstones carry the
      fact of a deletion; a hard delete would be resurrected by every union.

   ! Conflict rule: last-write-wins per jot_id on SERVER `updated_at` (a
   trigger stamps it, so a wrong device clock cannot win an argument). A jot
   edited locally since its last push wins over anything pulled - the push
   that follows makes the server agree.
   ! Demo is triple-fenced: source==="demo" never syncs, DEMO_STORE never
   enters jot.v1, and a flush while the demo is open simply waits.
   ========================================================================== */
const SYNCKEY  = "jot.sync";         /* account binding, pull cursor, tombstones */
const SYNCHASH = "jot.sync.hashes";  /* jot_id -> content hash at last push      */

const syncMeta = {
  get(){ try { return JSON.parse(localStorage.getItem(SYNCKEY) || "{}"); } catch { return {}; } },
  set(m){ try { localStorage.setItem(SYNCKEY, JSON.stringify(m)); } catch {} }
};
const syncHashes = {
  get(){ try { return JSON.parse(localStorage.getItem(SYNCHASH) || "{}"); } catch { return {}; } },
  set(h){ try { localStorage.setItem(SYNCHASH, JSON.stringify(h)); } catch {} }
};

/* stable stringify: a pulled copy and a typed copy of one jot build their
   keys in different orders, and an order-sensitive hash would re-push every
   pulled jot once for nothing. */
function stableJson(v){
  if (v === null || typeof v !== "object") return JSON.stringify(v);
  if (Array.isArray(v)) return "[" + v.map(stableJson).join(",") + "]";
  return "{" + Object.keys(v).sort().map(k => JSON.stringify(k) + ":" + stableJson(v[k])).join(",") + "}";
}
function jotHash(j){
  const s = stableJson(j);
  let h = 5381;
  for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0;
  return h.toString(36) + ":" + s.length;
}
/* the record minus live UI state - same underscore rule the export uses */
function syncClean(j){
  const o = {};
  for (const k in j) if (k[0] !== "_") o[k] = j[k];
  return o;
}
const syncable = j => !j._open && !!j.closed_at && j.source !== "demo";
const wordsOf = t => (String(t).trim().match(/\S+/g) || []).length;

/* the same address vector() computes, under the column names the database
   stores. Conventions ported from 6-Scripts/jot_schema.py buckets() - never
   invented here. */
function syncJotRow(j){
  const v = vector(j), paras = j.paragraphs || [];
  let dur = null;
  if (j.opened_at && j.closed_at){
    const d = Math.round((new Date(j.closed_at) - new Date(j.opened_at)) / 1000);
    if (isFinite(d) && d >= 0) dur = d;
  }
  const row = {
    jot_id: j.jot_id, category: j.category,
    prompt_text: j.prompt_text || "", opened_at: j.opened_at,
    closed_at: j.closed_at || null, source: j.source || "jot",
    d_date: v.date, d_dow: v.dow, d_week: v.week, d_month: v.month,
    d_quarter: v.quarter, d_year: v.year, d_decade: v.decade,
    d_hour: v.hour, d_daypart: v.daypart,
    n_paragraphs: paras.length,
    n_chars: paras.reduce((n, p) => n + (p.text || "").length, 0),
    n_words: paras.reduce((n, p) => n + wordsOf(p.text || ""), 0),
    duration_s: dur,
    /* explicit null ON PURPOSE: an edit pushed after a delete elsewhere
       clears the tombstone - the edit is the newer intent and wins */
    deleted_at: null,
    locked: !!j.locked
  };
  /* ⚠ ALWAYS present, null when absent - PostgREST refuses a bulk insert
     whose rows differ in shape ("All object keys must match", caught live on
     his first real push, 8/20). Uniform rows or no rows. */
  for (const k of ["split_from","topic","kind","day_label","form",
                   "weekday_written","date_original","src_doc"])
    row[k] = j[k] !== undefined ? j[k] : null;
  return row;
}
function syncParaRows(j){
  const out = []; let prev = null;
  (j.paragraphs || []).forEach(function(p, i){
    let gap = null;
    if (prev){ const g = Math.round((new Date(p.ts) - new Date(prev)) / 1000); if (isFinite(g)) gap = g; }
    out.push({ jot_id: j.jot_id, seq: i + 1, ts: p.ts, text: p.text || "",
               gap_s: gap, n_chars: (p.text || "").length,
               n_words: wordsOf(p.text || ""), source: p.source || null });
    prev = p.ts;
  });
  return out;
}

async function sbRest(method, pathq, body, prefer){
  if (!(await sbEnsureFresh())) return { error: "signed out" };
  let r;
  try {
    const h = { "apikey": SB_KEY,
                "Authorization": "Bearer " + auth.session.access_token,
                "Content-Type": "application/json" };
    if (prefer) h["Prefer"] = prefer;
    r = await fetch(SB_URL + "/rest/v1/" + pathq, {
      method: method, headers: h,
      body: body === undefined ? undefined : JSON.stringify(body)
    });
  } catch (e){ return { error: "offline" }; }
  if (r.status === 204) return { data: null };
  let d = null;
  try { d = await r.json(); } catch {}
  if (!r.ok) return { error: (d && (d.message || d.msg || d.hint)) || ("HTTP " + r.status) };
  return { data: d };
}

let SYNC_STATE = { running: false, line: "Never synced from this device.", last: null };
function syncStatusLine(){ return SYNC_STATE.line; }
const sEnc = encodeURIComponent;
const inList = ids => 'in.(' + ids.map(x => '"' + String(x).replace(/"/g, "") + '"').join(",") + ')';

/* ! One flush at a time - and a second caller JOINS the running one rather
   than being told "waiting". His first real push proved why: the boot flush
   was mid-corpus when he pressed Sync now, and the button shrugged at him
   while 61 jots were in fact flowing up. */
let _syncInflight = null;
function syncFlush(){
  if (_syncInflight) return _syncInflight;
  _syncInflight = _syncRun().finally(function(){ _syncInflight = null; });
  return _syncInflight;
}

async function _syncRun(){
  if (!auth.signedIn) return { error: "Not signed in." };
  if (demoActive()) return { ok: "Demo open - sync resumes when you leave it." };
  if (STORE_LOCKED) return { error: "The store is locked, so sync refused to touch it." };
  SYNC_STATE.running = true;
  SYNC_STATE.line = "Syncing...";
  const fail = m => { SYNC_STATE.line = m; return { error: m }; };
  try {
    if (!(await sbEnsureFresh())) return fail("Session expired. Sign in again.");
    const me = auth.session.user && auth.session.user.id;
    const meta = syncMeta.get();
    /* !! ACCOUNT BINDING. If this device's corpus has synced under one
       account, a different sign-in must NOT push his jots into it. */
    if (me && meta.user_id && meta.user_id !== me)
      return fail("This device's jots belong to another account. Sync is paused.");

    /* ---- PULL ---- */
    let since = meta.last_pull || "1970-01-01T00:00:00+00:00";
    let pulled = [], page;
    do {
      const r = await sbRest("GET", "jot?select=*&updated_at=gt." + sEnc(since) +
                                    "&order=updated_at.asc&limit=1000");
      if (r.error) return fail("Pull failed: " + r.error);
      page = r.data || [];
      pulled = pulled.concat(page);
      if (page.length) since = page[page.length - 1].updated_at;
    } while (page.length === 1000);

    const hashes = syncHashes.get();
    const st = load();
    const localBy = {};
    st.jots.forEach(j => { localBy[j.jot_id] = j; });
    const dirty = {};                 /* local edits not yet pushed: local wins on pull */
    st.jots.forEach(function(j){
      if (syncable(j) && hashes[j.jot_id] !== jotHash(syncClean(j))) dirty[j.jot_id] = true;
    });

    let touched = 0;
    const want = pulled.filter(row => !row.deleted_at && !dirty[row.jot_id]);
    const paraBy = {};
    for (let i = 0; i < want.length; i += 60){
      const ids = want.slice(i, i + 60).map(r => r.jot_id);
      const r = await sbRest("GET", "paragraph?select=jot_id,seq,ts,text,source&jot_id=" +
                                    sEnc(inList(ids)) + "&order=jot_id.asc,seq.asc");
      if (r.error) return fail("Pull failed: " + r.error);
      (r.data || []).forEach(p => { (paraBy[p.jot_id] = paraBy[p.jot_id] || []).push(p); });
    }
    pulled.forEach(function(row){
      if (dirty[row.jot_id]) return;
      if (row.deleted_at){
        if (localBy[row.jot_id]){
          st.jots = st.jots.filter(x => x.jot_id !== row.jot_id);
          delete localBy[row.jot_id]; touched++;
        }
        delete hashes[row.jot_id];
        return;
      }
      const paras = (paraBy[row.jot_id] || []).sort((a, b) => a.seq - b.seq)
        .map(function(p){ const o = { ts: p.ts, text: p.text }; if (p.source) o.source = p.source; return o; });
      if (!paras.length) return;      /* a jot with no text is not a record */
      const j = { jot_id: row.jot_id, category: row.category,
                  prompt_text: row.prompt_text, opened_at: row.opened_at,
                  closed_at: row.closed_at, paragraphs: paras };
      if (row.source && row.source !== "jot") j.source = row.source;
      ["split_from","topic","kind","day_label","form","weekday_written",
       "date_original","src_doc"].forEach(function(k){
        if (row[k] !== undefined && row[k] !== null) j[k] = row[k];
      });
      if (row.locked) j.locked = true;
      const h = jotHash(syncClean(j)), cur = localBy[row.jot_id];
      if (cur && jotHash(syncClean(cur)) === h){ hashes[row.jot_id] = h; return; }
      if (cur) st.jots[st.jots.indexOf(cur)] = j;
      else st.jots.push(j);
      localBy[row.jot_id] = j; hashes[row.jot_id] = h; touched++;
    });
    if (touched && !save(st))
      return fail("Pull could not be saved - the store refused the write.");

    /* ---- PUSH - only closed jots, dup ids collapsed to the LAST occurrence
       (his real store carries duplicate rows; a batch with a repeated key
       makes Postgres refuse the whole upsert) ---- */
    const changed = [], seen = {};
    st.jots.forEach(function(j){
      if (!syncable(j)) return;
      if (hashes[j.jot_id] === jotHash(syncClean(j))) return;
      if (seen[j.jot_id] !== undefined) changed[seen[j.jot_id]] = j;
      else { seen[j.jot_id] = changed.length; changed.push(j); }
    });
    for (let i = 0; i < changed.length; i += 100){
      const batch = changed.slice(i, i + 100);
      const up = await sbRest("POST", "jot", batch.map(syncJotRow),
                              "resolution=merge-duplicates,return=minimal");
      if (up.error) return fail("Push failed: " + up.error);
      /* paragraphs are REPLACED per jot: an edit can shorten a jot, and an
         upsert cannot express "row three no longer exists" */
      const ids = batch.map(j => j.jot_id);
      const del = await sbRest("DELETE", "paragraph?jot_id=" + sEnc(inList(ids)));
      if (del.error) return fail("Push failed: " + del.error);
      const paras = [];
      batch.forEach(j => paras.push.apply(paras, syncParaRows(j)));
      if (paras.length){
        const ins = await sbRest("POST", "paragraph", paras, "return=minimal");
        if (ins.error) return fail("Push failed: " + ins.error);
      }
      batch.forEach(j => { hashes[j.jot_id] = jotHash(syncClean(j)); });
    }

    /* ---- TOMBSTONES ---- */
    const tomb = meta.tomb || [], nTomb = tomb.length;
    if (nTomb){
      const r = await sbRest("PATCH", "jot?jot_id=" + sEnc(inList(tomb.map(t => t.jot_id))),
                             { deleted_at: new Date().toISOString() }, "return=minimal");
      /* a locked row refuses its tombstone BY DESIGN (the read-only journals);
         that refusal must not wedge the queue forever */
      if (r.error && !/locked/i.test(r.error)) return fail("Delete sync failed: " + r.error);
      tomb.forEach(t => delete hashes[t.jot_id]);
      meta.tomb = [];
    }

    meta.user_id = me || meta.user_id;
    meta.last_pull = since;
    meta.last_ok = iso(new Date());
    syncMeta.set(meta); syncHashes.set(hashes);
    SYNC_STATE.last = meta.last_ok;
    SYNC_STATE.line = "Synced " + new Date().toLocaleTimeString() + " - " +
                      changed.length + " pushed, " + pulled.length + " pulled" +
                      (nTomb ? ", " + nTomb + " delete" + (nTomb === 1 ? "" : "s") + " carried" : "") + ".";
    return { ok: SYNC_STATE.line };
  } finally {
    SYNC_STATE.running = false;
  }
}

let _syncTimer = null;
function syncSchedule(ms){
  if (!auth.signedIn) return;
  clearTimeout(_syncTimer);
  _syncTimer = setTimeout(function(){ syncFlush(); }, ms === undefined ? 4000 : ms);
}
function syncTombstone(id){
  const meta = syncMeta.get();
  (meta.tomb = meta.tomb || []).push({ jot_id: id, deleted_at: iso(new Date()) });
  syncMeta.set(meta);
  const h = syncHashes.get(); delete h[id]; syncHashes.set(h);
  syncSchedule(1000);
}
window.addEventListener("online", function(){ syncSchedule(2000); });
setInterval(function(){ syncSchedule(1); }, 10 * 60 * 1000);

/* ── CONFIRMATION AND RECOVERY LINKS ────────────────────────────────────────
   Supabase email links land back on the app with the session in the URL hash.
   Trade it for a stored session, scrub the URL, and for a recovery link ask
   for the new password right here - without this, "forgot password" dead-ends
   on a signed-in page with no way to actually set one. */
(function sbHashSession(){
  if (!location.hash || location.hash.indexOf("access_token=") < 0) return;
  const p = new URLSearchParams(location.hash.slice(1));
  const at = p.get("access_token");
  if (!at) return;
  auth.session = {
    access_token: at, refresh_token: p.get("refresh_token"),
    expires_at: Math.floor(Date.now() / 1000) + parseInt(p.get("expires_in") || "3600", 10),
    user: null
  };
  const kind = p.get("type") || "";
  history.replaceState(null, "", location.pathname + location.search);
  if (kind === "recovery"){
    const np = window.prompt("New password (6+ characters):");
    if (np && np.length >= 6)
      fetch(SB_URL + "/auth/v1/user", { method: "PUT",
        headers: { "apikey": SB_KEY, "Content-Type": "application/json",
                   "Authorization": "Bearer " + at },
        body: JSON.stringify({ password: np }) }).catch(function(){});
  }
  sbRefresh();   /* fills in the user object; failure keeps the hash session */
})();

/* ── THE ENTRY PROMPT ───────────────────────────────────────────────────────
   His ask: "jot should prompt log in or sign up upon entry".

   !! IT PROMPTS, IT DOES NOT GATE, and that difference is deliberate enough to
   need saying. There is a "Not now" on this screen. Without it, opening jot
   with no signal would mean no capture - and a capture tool that cannot
   capture when the network is down has failed at the one moment it matters.
   ONE line makes it a hard wall if he wants one; it is marked below.

   ! Shown only when signed OUT and only ONCE per install. A prompt that
   reappears every open is not a prompt, it is a nag, and he would learn to
   dismiss it without reading. */
const GATEKEY = "jot.gate.seen";

function resetLibraryView(){
  libView.group = "day"; libView.cat = "all"; libView.part = "all"; libView.q = "";
  libView.open = new Set(); libView.seeded = null; libView.groupAuto = true;
  libView.sections = libraryInitialSections(demoActive());
}

function validDemoPayload(payload){
  return !!payload && payload.profile?.id === "john-doe-demo" &&
    payload.profile?.fictional === true && Array.isArray(payload.jots) &&
    payload.jots.length > 0 && payload.jots.every(jot =>
      jot?.source === "demo" && typeof jot.jot_id === "string" &&
      typeof jot.opened_at === "string" && Array.isArray(jot.paragraphs) &&
      jot.paragraphs.length === 1 && jot.paragraphs[0]?.source === "demo"
    );
}

function freezeDemo(value){
  if (!value || typeof value !== "object" || Object.isFrozen(value)) return value;
  Object.freeze(value);
  Object.values(value).forEach(freezeDemo);
  return value;
}

async function startDemo(){
  if (demoActive()){ lib.classList.add("on"); renderLib(); return { ok:"Demo open." }; }
  const realBytes = localStorage.getItem(KEY);
  try {
    const response = await fetch("./demo/john-doe.json", { cache:"force-cache" });
    if (!response.ok) throw new Error("Demo file is unavailable.");
    const payload = await response.json();
    if (!validDemoPayload(payload)) throw new Error("Demo file did not pass its source and shape checks.");
    if (localStorage.getItem(KEY) !== realBytes) throw new Error("Your local store changed while the demo loaded. Nothing was replaced.");
    DEMO_STORE = freezeDemo(payload);
    promptEditMode = false; promptAddMode = false; pendingHidePrompt = null;
    resetLibraryView();
    lib.classList.add("on"); renderLib();
    return { ok:"John Doe demo loaded." };
  } catch (error){
    DEMO_STORE = null;
    return { error:error?.message || "The demo could not be loaded." };
  }
}

function exitDemo(stayInLibrary=true){
  DEMO_STORE = null;
  resetLibraryView();
  if (stayInLibrary){ lib.classList.add("on"); renderLib(); }
  else renderHome();
}

    const c = creds();
    if (!c[0] || !c[1]) return say({ error: "Email and password, both." });
    if (c[1].length < 6) return say({ error: "Password needs at least 6 characters." });
    busy(true); say({ ok: "Creating your account..." }, true);
    const r = await doSignUp(c[0], c[1]); busy(false); say(r);
  };
  wrap.querySelector("#aForgot").onclick = async function(){
    const c = creds();
    if (!c[0]) return say({ error: "Put your email in the box first." });
    busy(true); const r = await doRecover(c[0]); busy(false); say(r);
  };
}

if ("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}

/* ★★★ ASK THE BROWSER NOT TO EVICT THIS DATA.
   Without durable storage, localStorage is "best effort": a browser under disk
   pressure may clear it, and the writing is gone with no warning and no undo.
   Granting persistence moves the store into the class the browser will not
   reclaim on its own.

   ⚠⚠ THIS COULD NOT BE WRITTEN UNTIL 2026-08-16. `navigator.storage` is
   gated on a SECURE CONTEXT, and the app was served over plain HTTP from a
   LAN IP - so the API was simply absent on the one device it mattered on. The
   call is new because the transport is new, not because it was overlooked.

   ⚠ What it does NOT fix, stated plainly so nobody reads more into it:
   - iOS/Safari still clears script-writable storage after 7 days without a
     visit to the origin. Persistence does not exempt an app from that; opening
     it regularly, and installing it to the Home Screen, is what does.
   - It is not a backup. Export is the backup. This only stops the BROWSER
     from discarding the data; it does nothing about a cleared profile, a lost
     phone, or a tapped "clear site data".

   Silent by design: Chrome decides from engagement heuristics without a
   prompt, and a denial is not an error state worth showing - the app works
   identically either way. */
if (navigator.storage && navigator.storage.persist){
  navigator.storage.persisted()
    .then(already => already ? true : navigator.storage.persist())
    .catch(() => {});
}

window.JotTheme.bind();
entryGate();
clock(); setInterval(clock, 15000);   /* < ROTATE_MS so a flip is never missed */
renderHome();
if (auth.signedIn) syncSchedule(2500);   /* signed in at open -> quiet catch-up */
</script>
