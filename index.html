const KEY = "jot.v1";
/* ★★★ THE PROMPTS, REWRITTEN ON ONE PRINCIPLE (he gave me the call, 8/14).
   A PROMPT SHOULD BE ANSWERABLE IN ONE BREATH, RIGHT NOW.

   "What did you just eat?" is the best line he wrote and it is the template.
   "Just" beats "today" because today asks for a SUMMARY and now asks only for
   an OBSERVATION - and a prompt you have to summarise for is a prompt you skip
   when you are tired, which is exactly when the entry matters most.

   Changed, with reasons:
     body   "what did your body do today" -> "just do". Same fix as food.
     social "how did you feel after talking" -> "Who did you just see?"
            ★ His original ended in a colon, inviting a NAME. My first rewrite
            lost that. This gets it back and adds immediacy. His instinct was
            right and my correction was the worse of the two.
     work   "what did you build today" -> "What are you building?" Present
            continuous is answerable at any hour, including before you start.
     day    "Was your day fulfilling?" -> "What made today count?"
            ⚠ A YES/NO PROMPT GETS A ONE-WORD ANSWER. The old one closed the
            door it was trying to open. This one cannot be answered with "yes".

   Kept: what's on your mind, what did you just eat, grateful for, avoiding.

   ⚠⚠ THE KEYS DO NOT CHANGE even where the wording did. `fulfillment` stays
   `fulfillment` in storage. Renaming a key orphans every row already written
   under it, and the display name is free while the key is not. */
/* ------------------------------------------------------------- day parts ---
   ★★ EIGHT BUCKETS OF THREE HOURS. His instruction, 2026-08-14: "more
   consistent hours ... maybe all 3 hours?" He spotted that midday was the
   smallest at 2.0h while morning ran 4.5h - a 2.25x spread.

   ★★★ EQUAL WIDTH IS THE WHOLE POINT. With uneven buckets a COUNT is not
   comparable to a COUNT: "most of my jots are in the morning" might only mean
   the morning bucket was wider. With equal buckets a raw count IS a rate.

   ⚠ 24 / 3 = 8, so all-3-hours FORCES an eighth name. 09:00-11:59 was the gap
   and it is now "midmorning" / "Brunch Brief" - a placeholder, his to overrule.

   ⚠ Noon is now a BOUNDARY, reversing the earlier straddle. Before lunch and
   after lunch are genuinely different states, and the straddle only existed to
   paper over having seven uneven buckets.
   ⚠ Must stay identical to DAYPARTS in 6-Scripts/jot_schema.py.
   [startMinute, generic, fun] --------------------------------------------- */
const DAYPARTS = [
  [   0, "late",       "Midnight Margin" ],   // 00:00 - 02:59
  [ 180, "dawn",       "Dawn Draft"      ],   // 03:00 - 05:59
  [ 360, "morning",    "Early Muse"      ],   // 06:00 - 08:59  (ruled 8/20)
  [ 540, "midmorning", "Brunch Brief"    ],   // 09:00 - 11:59
  [ 720, "midday",     "Noon Doodle"     ],   // 12:00 - 14:59
  [ 900, "afternoon",  "Back Drift"      ],   // 15:00 - 17:59  (ruled 8/20)
  [1080, "evening",    "Sunset Echo"      ],   // 18:00 - 20:59  (ruled 8/20)
  [1260, "night",      "Nightcap Note"    ],   // 21:00 - 23:59
];
const partOf = d => DAYPARTS.filter(p => d.getHours()*60 + d.getMinutes() >= p[0]).pop();

/* ★★★ ONE TIMESTAMP = ONE JOT. His ruling 2026-08-15:
   "all of these need to separate jots so i can tap to file individually -
    different timestamps means different jot! and even if same timestamp -
    each timestamp is a jot"

   This overturns the continuous-jot model from 8/14 and he is right. Three
   unrelated thoughts - basketball, a call with a partner, a night reflection -
   were sharing ONE category and ONE suggested bucket because they happened to
   be typed on the same day under the same prompt. **A record you cannot file
   individually is not a record, it is a paragraph.**

   ★ The migration keeps every jot holding EXACTLY ONE paragraph, which is why
   nothing downstream had to change: vector(), words(), todayCount(), jotRow()
   and renderJot() all still read `paragraphs` and simply see arrays of one.

   ⚠⚠ IT TOUCHES HIS REAL RECORDS, so it backs up FIRST and never runs twice.
   `jot.v1.pre-split` is written before a single jot is rewritten, and it is
   never deleted by this code. */
const SPLIT_FLAG = "jot.split.v2";

/* ★★ ONE split transform, used by BOTH the migration and the importer.
   ⚠⚠ IT HAS TO BE SHARED, and testing is what proved it: importing the same
   file twice ADDED DUPLICATES, because load() had split a 2-paragraph jot into
   ids `<id>-1` and `<id>-2` while the file on disk still held `<id>`. The
   importer looked for `<id>`, did not find it, and inserted it again - then
   the next load split THAT, and the corpus grew on every import.
   ★ Deriving the ids the same way on both sides makes re-import a no-op,
   which is the only acceptable behaviour for a merge. */
function splitJots(arr){
  const out = [];
  for (const j of (arr || [])){
    const ps = j.paragraphs || [];
    if (ps.length <= 1){ out.push(j); continue; }
    ps.forEach((p, i) => out.push({
      ...j,
      jot_id: j.jot_id + "-" + (i + 1),
      opened_at: p.ts || j.opened_at,    /* the ENTRY's time is now the jot's */
      closed_at: p.ts || j.closed_at,
      paragraphs: [p],
      split_from: j.jot_id               /* provenance, never guessed later */
    }));
  }
  return out;
}

function splitMigrate(s){
  if (!s || !Array.isArray(s.jots)) return s;
  /* ⚠⚠ THE FLAG WAS THE BUG. v1 ran this ONCE and then never again - so a jot
     written by an OLDER CACHED BUILD after the flag was set kept two
     paragraphs forever. That is not hypothetical: his 9:22pm export carries
     exactly one such jot (gratitude, 21:15 + 21:21), because the service
     worker served him the pre-split app for one open while the migration had
     already stamped its flag.
     ★ Splitting is NATURALLY IDEMPOTENT - after a pass, nothing has >1
     paragraph, so there is nothing to do on the next pass. The flag bought
     nothing and cost self-healing. Only the BACKUP is once-only. */
  const needs = s.jots.some(j => (j.paragraphs || []).length > 1);
  if (!needs) return s;

  if (!localStorage.getItem(SPLIT_FLAG)){
    try {
      localStorage.setItem("jot.v1.pre-split", JSON.stringify(s));
      localStorage.setItem(SPLIT_FLAG, "1");
    }
    catch (e){ return s; }        /* ⚠ no backup, no migration. Never both. */
  }

  const out = splitJots(s.jots);
  const before = s.jots.reduce((n, j) => n + (j.paragraphs || []).length, 0);
  const after  = out.reduce((n, j) => n + (j.paragraphs || []).length, 0);
  /* ⚠⚠ CONDITION TEST, not a vibe: if a single paragraph would be lost the
     migration does not fire and the original store stands untouched. */
  if (after !== before) return s;

  s.jots = out;
  localStorage.setItem(KEY, JSON.stringify(s));
  return s;
}

/* ⚠⚠⚠ S2 — THE OLD CATCH BLOCK WAS A DATA-DESTRUCTION PATH WEARING THE
   COSTUME OF ERROR HANDLING. Proven by execution, not reasoning: truncate the
   stored JSON and `load()` returned {jots:[]} while the raw string was STILL
   ON DISK and fully recoverable. The library then rendered "no jots yet", and
   the very next save() overwrote the recoverable raw text with a one-jot
   store. An interrupted write - quota, a killed tab, iOS backgrounding -
   turned "corrupt but recoverable" into "gone" the moment he wrote again.

   Now: the raw string is copied aside, writes are BLOCKED, and he is told. */
let STORE_LOCKED = null;      /* non-null = a reason writes are refused */

/* ★★ ONE PARSE PER CHANGE, NOT ONE PER CALL. load() had NINE call sites and
   several run inside render loops, so a single library render re-parsed the
   whole store repeatedly - measured at 8.1ms and 30.7ms for 2.8MB and 11MB
   stores, on desktop.
   ⚠ The cache is invalidated ONLY by save(), which is the single writer in
   this file. If another writer is ever added it MUST bump STORE_GEN or the
   app will read stale data - which is a correctness bug, not a speed one. */
let _storeCache = null, STORE_GEN = 0;
let DEMO_STORE = null;
const demoActive = () => !!DEMO_STORE;

const load = () => {
  if (demoActive()) return DEMO_STORE;
  if (_storeCache && _storeCache.gen === STORE_GEN) return _storeCache.value;
  const v = _loadRaw();
  _storeCache = { gen: STORE_GEN, value: v };
  return v;
};

const _loadRaw = () => {
  const raw = localStorage.getItem(KEY);
  if (raw == null) return {jots:[]};
  let s;
  try { s = JSON.parse(raw); }
  catch (e){
    /* keep the bytes. They are the only copy and they are still readable. */
    const at = "jot.v1.corrupt." + Date.now();
    try { if (!STORE_LOCKED) localStorage.setItem(at, raw); } catch {}
    STORE_LOCKED = "The saved data could not be read. Nothing has been "
                 + "overwritten and the original is kept at " + at
                 + ". Export from a working copy before writing again.";
    bannerUp();
    return {jots:[]};
  }
  /* ⚠ shape, not just parseability. A payload that parses but has no .jots
     threw `Cannot read properties of undefined` deeper in the app. */
  if (!s || !Array.isArray(s.jots)){
    STORE_LOCKED = "The saved data is the wrong shape. Writes are paused so "
                 + "nothing is lost.";
    bannerUp();
    return {jots:[]};
  }
  return splitMigrate(s);
};

const save = s => {
  if (demoActive()) return false;
  if (STORE_LOCKED){ bannerUp(); return false; }
  try {
    localStorage.setItem(KEY, JSON.stringify(s));
    /* ⚠ every cache keyed on the store hangs off this one counter. Bump it
       AFTER the write succeeds, never before - a failed write must not
       invalidate a cache that still matches what is on disk. */
    STORE_GEN++;
    /* sync is a LISTENER on the single writer, never a second writer: a
       successful save only schedules a background flush. Nothing here blocks
       or throws - capture must not know the network exists. */
    if (typeof syncSchedule === "function") syncSchedule();
    return true;
  } catch (e){
    /* ⚠⚠ S6 — QUOTA. Identity confirmed in-browser: QuotaExceededError,
       code 22 (1014 on Firefox). ★ NEVER PRUNE TO MAKE ROOM: in Safari
       private mode the quota is effectively zero, so the FIRST write throws -
       a prune-and-retry handler would delete the whole corpus and still fail.
       Stop, say so, and put Export in front of him. */
    const quota = e && (e.code === 22 || e.code === 1014 ||
                        e.name === "QuotaExceededError" ||
                        e.name === "NS_ERROR_DOM_QUOTA_REACHED");
    STORE_LOCKED = quota
      ? "Storage is full. This jot is still on screen and is NOT saved yet. "
      + "Export now, then clear space."
      : "The save failed. This jot is still on screen and is NOT saved yet.";
    bannerUp();
    return false;
  }
};

/* one honest, unmissable banner. ⚠ It must not depend on load() - the whole
   point is that it fires when load() is the thing that failed. */
function bannerUp(){
  if (!STORE_LOCKED) return;
  let b = document.getElementById("slock");
  if (!b){
    b = document.createElement("div");
    b.id = "slock";
    document.body.appendChild(b);
    b.addEventListener("click", () => doExport());
  }
  b.textContent = "⚠ " + STORE_LOCKED + "  ·  TAP TO EXPORT";
}
const p2 = n => String(n).padStart(2,"0");
const iso = d => {
  const z = -d.getTimezoneOffset(), s = z >= 0 ? "+" : "-", a = Math.abs(z);
  return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}T` +
         `${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}${s}${p2(a/60|0)}:${p2(a%60)}`;
};
const clk = d => `${(d.getHours()%12)||12}:${p2(d.getMinutes())}${d.getHours()<12?"AM":"PM"}`;
const tzAbbr = d => { try { return new Intl.DateTimeFormat("en-US",{timeZoneName:"short"})
  .formatToParts(d).find(p => p.type==="timeZoneName").value; } catch { return ""; } };
const uid = () => (crypto.randomUUID ? crypto.randomUUID()
                  : Date.now()+"-"+Math.random().toString(16).slice(2));

/* the ADDRESS. one timestamp, ten places at once. same fields the db stores. */
/* ⚠⚠ DO NOT MEMOISE THIS. I did, and BENCHMARKING REVERTED IT: at 5,000 jots
   the memoised second pass ran 25.8ms against 17.9ms uncached. Building a
   string cache key costs more than vector() itself, and any cap small enough
   to be safe thrashes on a corpus larger than the cap.
   ★ The load() and lexicon caches next to it are enormous wins (suggest went
   182ms -> 0.094ms). This one measured NEGATIVE and was removed. The point of
   benchmarking is to delete the optimisations that do not pay. */
function vector(j){
  const d = new Date(j.opened_at), part = partOf(d);
  const th = new Date(d); th.setDate(d.getDate() + 4 - (d.getDay()||7));
  const wk = Math.ceil(((th - new Date(th.getFullYear(),0,1)) / 864e5 + 1) / 7);
  return {
    category: j.category,
    daypart:  part[1], fun: part[2],
    date:  `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`,
    dow:   ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][d.getDay()],
    week:  `${th.getFullYear()}-W${p2(wk)}`,
    month: `${d.getFullYear()}-${p2(d.getMonth()+1)}`,
    quarter: `${d.getFullYear()}-Q${Math.floor(d.getMonth()/3)+1}`,
    year:  d.getFullYear(),
    decade:`${Math.floor(d.getFullYear()/10)*10}s`,
    hour:  d.getHours()
  };
}

const $ = s => document.querySelector(s);
$("#done").innerHTML = I.check;
$("#jumpFirst").innerHTML = I["chevron-down"];
$("#jumpLatest").innerHTML = I["chevron-down"];
const home=$("#home"), pad=$("#pad"), lib=$("#lib"), libBody=$("#libbody");
let live = null;

/* Order is fixed rather than clever. An order that reshuffles by time of day
   moves the target the thumb is reaching for, and muscle memory beats
   relevance on a screen you open twenty times a day.
   ⚠ fulfillment sits LAST on purpose: it is the only one that asks about the
   day as a whole, so it reads as the closing question. */
/* the label under the hood vs the label on screen. `plus` and `fulfillment`
   keep their storage keys forever; only what a person reads changes. */
/* PROMPT_DECK_PURE_START */
const BUILTIN_PROMPT_IDS = ["plus","food","body","social","work","gratitude","avoid","fulfillment"];
const BUILTIN_PROMPT_DEFINITIONS = {
  plus:        { label:"THOUGHTS", prompt:"What's on your mind?" },
  food:        { label:"FOOD",     prompt:"What did you just eat?" },
  body:        { label:"BODY",     prompt:"What did your body just do?" },
  social:      { label:"SOCIAL",   prompt:"Who did you just see?" },
  work:        { label:"WORK",     prompt:"What are you building?" },
  gratitude:   { label:"GRATEFUL", prompt:"What are you grateful for?" },
  avoid:       { label:"AVOIDING", prompt:"What are you avoiding?" },
  fulfillment: { label:"DAY",      prompt:"What made today count?" }
};

function defaultPromptDeck(){
  return {
    version: 1,
    items: BUILTIN_PROMPT_IDS.map(id => ({
      id,
      label: BUILTIN_PROMPT_DEFINITIONS[id].label,
      prompt: BUILTIN_PROMPT_DEFINITIONS[id].prompt,
      kind: "builtin",
      active: true,
      created_at: null
    }))
  };
}

function validPromptText(value, max){
  return typeof value === "string" && value.trim().length > 0 && value.trim().length <= max;
}

function normalizePromptDeck(raw){
  if (!raw || raw.version !== 1 || !Array.isArray(raw.items)) return defaultPromptDeck();

  const seen = new Set();
  const items = [];
  for (const candidate of raw.items){
    if (!candidate || typeof candidate.id !== "string") continue;
    const id = candidate.id.trim();
    if (!id || seen.has(id)) continue;
    const isBuiltin = BUILTIN_PROMPT_IDS.includes(id);
    if (isBuiltin){
      const definition = BUILTIN_PROMPT_DEFINITIONS[id];
      items.push({ id, label:definition.label, prompt:definition.prompt, kind:"builtin", active:candidate.active !== false, created_at:null });
      seen.add(id);
      continue;
    }
    if (candidate.kind !== "custom" || !validPromptText(candidate.label, 24) || !validPromptText(candidate.prompt, 160)) continue;
    items.push({
      id,
      label: candidate.label.trim().toUpperCase(),
      prompt: candidate.prompt.trim(),
      kind: "custom",
      active: candidate.active !== false,
      created_at: typeof candidate.created_at === "string" ? candidate.created_at : null
    });
    seen.add(id);
  }

  for (const id of BUILTIN_PROMPT_IDS){
    if (seen.has(id)) continue;
    const definition = BUILTIN_PROMPT_DEFINITIONS[id];
    items.push({ id, label:definition.label, prompt:definition.prompt, kind:"builtin", active:false, created_at:null });
  }
  return { version:1, items };
}

function ensurePromptDeck(store){
  return { ...store, prompt_deck:normalizePromptDeck(store && store.prompt_deck) };
}

function movePromptItem(deck, id, direction){
  const normalized = normalizePromptDeck(deck);
  const items = normalized.items.slice();
  const from = items.findIndex(item => item.id === id);
  const to = Math.max(0, Math.min(items.length - 1, from + Math.sign(direction)));
  if (from < 0 || from === to) return normalized;
  const [item] = items.splice(from, 1);
  items.splice(to, 0, item);
  return { version:1, items };
}

function moveActivePromptItem(deck, id, direction){
  const normalized = normalizePromptDeck(deck);
  const items = normalized.items.slice();
  const activeIndexes = items.map((item, index) => item.active ? index : -1).filter(index => index >= 0);
  const activePosition = activeIndexes.findIndex(index => items[index].id === id);
  const targetPosition = activePosition + Math.sign(direction);
  if (activePosition < 0 || targetPosition < 0 || targetPosition >= activeIndexes.length) return normalized;
  const from = activeIndexes[activePosition], to = activeIndexes[targetPosition];
  [items[from], items[to]] = [items[to], items[from]];
  return { version:1, items };
}

function reorderActivePromptItem(deck, id, targetId, placement="before"){
  const normalized = normalizePromptDeck(deck);
  if (id === targetId) return normalized;
  const items = normalized.items.slice();
  const from = items.findIndex(item => item.id === id && item.active);
  const target = items.find(item => item.id === targetId && item.active);
  if (from < 0 || !target) return normalized;
  const [item] = items.splice(from, 1);
  const targetIndex = items.findIndex(candidate => candidate.id === targetId);
  items.splice(targetIndex + (placement === "after" ? 1 : 0), 0, item);
  return { version:1, items };
}

function setPromptActive(deck, id, active){
  const normalized = normalizePromptDeck(deck);
  return {
    version: 1,
    items: normalized.items.map(item => item.id === id ? { ...item, active:!!active } : item)
  };
}

function addCustomPrompt(deck, label, prompt, id, createdAt){
  const normalized = normalizePromptDeck(deck);
  if (normalized.items.filter(item => item.kind === "custom").length >= 2)
    return { deck:normalized, error:"custom-limit" };
  if (!validPromptText(label, 24) || !validPromptText(prompt, 160))
    return { deck:normalized, error:"invalid" };
  if (typeof id !== "string" || !id.trim() || normalized.items.some(item => item.id === id.trim()))
    return { deck:normalized, error:"duplicate" };
  return {
    error: null,
    deck: {
      version: 1,
      items: normalized.items.concat({
        id: id.trim(),
        label: label.trim().toUpperCase(),
        prompt: prompt.trim(),
        kind: "custom",
        active: true,
        created_at: typeof createdAt === "string" ? createdAt : null
      })
    }
  };
}

function resetPromptOrder(deck){
  const normalized = normalizePromptDeck(deck);
  const byId = new Map(normalized.items.map(item => [item.id, item]));
  const builtins = BUILTIN_PROMPT_IDS.map(id => byId.get(id));
  const customs = normalized.items.filter(item => item.kind === "custom");
  return { version:1, items:builtins.concat(customs) };
}

function mergePromptDeck(localDeck, importedDeck){
  const local = normalizePromptDeck(localDeck);
  if (!importedDeck || importedDeck.version !== 1 || !Array.isArray(importedDeck.items)) return local;
  const known = new Set(local.items.map(item => item.id));
  const additions = [];
  for (const item of importedDeck.items){
    if (!item || typeof item.id !== "string" || item.kind !== "custom") continue;
    const id = item.id.trim();
    if (!id || known.has(id)) continue;
    if (!validPromptText(item.label, 24) || !validPromptText(item.prompt, 160)) continue;
    additions.push({
      id, label:item.label.trim().toUpperCase(), prompt:item.prompt.trim(),
      kind:"custom", active:false, created_at:typeof item.created_at === "string" ? item.created_at : null
    });
    known.add(id);
  }
  return { version:1, items:local.items.concat(additions) };
}
/* PROMPT_DECK_PURE_END */

/* One canonical built-in registry feeds both the legacy classifier and the
   configurable Home deck, so prompt wording and labels cannot drift. */
const PROMPTS = Object.fromEntries(BUILTIN_PROMPT_IDS.map(id => [id, BUILTIN_PROMPT_DEFINITIONS[id].prompt]));
const CATLABEL = Object.fromEntries(BUILTIN_PROMPT_IDS.map(id => [id, BUILTIN_PROMPT_DEFINITIONS[id].label]));
const DECK = BUILTIN_PROMPT_IDS;
const allPromptItems = () => normalizePromptDeck(load().prompt_deck).items;
const activePromptItems = () => allPromptItems().filter(item => item.active);
const promptItem = id => allPromptItems().find(item => item.id === id) || null;
const label = c => promptItem(c)?.label || CATLABEL[c] || String(c).toUpperCase();
const promptFor = c => promptItem(c)?.prompt || PROMPTS[c] || "What's on your mind?";
const deck = () => activePromptItems().map(item => item.id);
const allCategoryIds = () => {
  const ids = new Set(allPromptItems().map(item => item.id));
  for (const jot of load().jots) if (typeof jot.category === "string" && jot.category) ids.add(jot.category);
  return [...ids];
};

/* "AUG 14th 2026" */
/* "FRI AUG 14, 2026" - his format. ⚠ Grouping still SORTS on v.date, because
   sorting on a display string would put APR before JAN. The label and the key
   are different jobs and this keeps them different. */
const dayLabel = v => `${v.dow.toUpperCase()} ${MON[+v.date.slice(5,7)-1]} ${+v.date.slice(8)}, ${v.year}`;
const ord = d => d + (["th","st","nd","rd"][(d%100-20)%10] || ["th","st","nd","rd"][d%100] || "th");
const MON = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
const longDate = d => `${MON[d.getMonth()]} ${ord(d.getDate())} ${d.getFullYear()}`;

/* generic or fun. ONE of them shows, never both.
   THREE modes: rotate (default), generic, fun.
   ROTATE flips every 3 minutes and is derived from the clock, not from stored
   state, so every surface in the app agrees on which list is showing without
   anything having to be kept in sync. */
/* ★ FUN IS THE DEFAULT, his ruling 2026-08-14: "I like the fun list - let's
   keep". Generic and rotate are not deleted, they are one tap on the header
   away. He expressed a preference, not a deletion, and the reversible reading
   is the correct one.
   ⚠ He did NOT rename "Brunch Brief", so the placeholder stands as the name. */

/* ------------------------------------------------- imported entries ---
   His ask, 2026-08-18: "i want all my journals turned jots - make sure
   theres an option to view and not view those imported entries."

   646 jots converted from the 2022-2024 notebooks all carry
   source = "import:journal". Nothing he has ever TYPED starts with that,
   so this filter cannot swallow a jot he wrote himself.

   *** VIEWS FOLLOW THE TOGGLE. BEHAVIOUR NEVER DOES. ***
   renderLib and renderStats are things he LOOKS at, so they respect it.
   lexicons() is not - it seeds the live prompts, and letting 2022
   vocabulary drive what the app suggests today would be a silent change
   to how the app behaves, controlled by a switch that says "view".
   So lexicons ALWAYS excludes imported, toggle or not.

   Lookups by jot_id are never filtered either. Hiding is a view concern;
   a hidden jot must still be findable, editable and exportable. */
const SHOW_IMPORTED = "jot.showImported";
const isImported  = j => typeof j?.source === "string" && j.source.startsWith("import:journal");
const showImported = () => localStorage.getItem(SHOW_IMPORTED) === "1";
const ownJots     = a => a.filter(j => !isImported(j));
const viewJots    = a => showImported() ? a : ownJots(a);

const NAMING = "jot.naming";
const ROTATE_MS = 3 * 60 * 1000;
const mode = () => localStorage.getItem(NAMING) || "fun";
const showingFun = () => {
  const m = mode();
  if (m === "fun") return true;
  if (m === "generic") return false;
  return Math.floor(Date.now() / ROTATE_MS) % 2 === 1;
};
const partName = p => showingFun() ? p[2] : p[1].toUpperCase();

/* the tint follows the real weekday, re-checked on every clock tick so it
   changes at midnight without a reload */
function dayTint(){
  const d = new Date().getDay();
  if (document.documentElement.dataset.day !== String(d))
    document.documentElement.dataset.day = String(d);
}

function clock(){
  dayTint();
  const n = new Date(), part = partOf(n);
  const html =
    `${longDate(n)}<br>` +
    `<span style="opacity:.78">${clk(n)} ${tzAbbr(n)} &nbsp;|&nbsp; ` +
    `<span class="dp" role="button" tabindex="0" title="Tap to swap lists">${partName(part)}</span></span>`;
  /* ★ ONE painter, EVERY header (ruled 8/20: the same top on all pages).
     Two elements, one string - they cannot drift. .dp is a class now: the
     old #dp id would have been a duplicate the moment there were two. */
  for (const el of [$("#clock"), $("#clock2")]){
    if (!el) continue;
    el.innerHTML = html;
    const dp = el.querySelector(".dp");
    /* tapping the name swaps to the other list and PINS it. */
    const swap = e => { e.stopPropagation();
      localStorage.setItem(NAMING, showingFun() ? "generic" : "fun");
      clock(); if (lib.classList.contains("on")) renderLib(); };
    dp.addEventListener("click", swap);
    dp.addEventListener("keydown", e => { if (e.key==="Enter"||e.key===" ") swap(e); });
  }
}

/* jots opened today, per category. THIS is what the box means. */
function todayCount(cat){
  const t = new Date(), key = t.getFullYear() + "-" + p2(t.getMonth()+1) + "-" + p2(t.getDate());
  /* ⚠ PARAGRAPHS, not jots. Now that a category holds one continuous jot per
     day, counting jots would only ever say 0 or 1 and tell him nothing. What
     he wants to see on the home screen is how much he actually captured. */
  return load().jots.filter(j => j.category === cat && vector(j).date === key)
                    .reduce((n, j) => n + j.paragraphs.length, 0);
}

function renderHome(){

  const visibleItems = activePromptItems();
  for (const item of visibleItems){
    const cat = item.id, prompt = item.prompt;
    const n = todayCount(cat);
    /* ⚠ THE BOX IS A CONTROL, NOT A STATUS LIGHT (his ruling, 2026-08-14).
       My first version gave one element two jobs - tap target AND state
       readout - so tapping an already ticked box looked like it would UNtick
       something. An affordance that also reports state is ambiguous the moment
       the two disagree. It ticks on TAP only, as touch feedback, and that tick
       carries through the expand.

       ★ "Done today" moved to the COUNT, where it cannot be mistaken for a
       control: accent when there is something today, silent when there is not.

      controls.append(up, down, hide);
      row.addEventListener("dragstart", event => {
        draggedPromptId = cat;
        row.classList.add("dragging");

      });

        const placement = event.clientY >= bounds.top + bounds.height / 2 ? "after" : "before";
        row.classList.toggle("drop-before", placement === "before");
        row.classList.toggle("drop-after", placement === "after");
      });
      row.addEventListener("dragleave", () => row.classList.remove("drop-before", "drop-after"));
      row.addEventListener("drop", event => {
        event.preventDefault();
        const from = draggedPromptId || event.dataTransfer.getData("text/plain");
        const placement = row.classList.contains("drop-after") ? "after" : "before";
        if (from && from !== cat) persistPromptDeck(reorderActivePromptItem(load().prompt_deck, from, cat, placement));
      });
      row.append(grip, copy, controls);

    const box = document.createElement("button");
    box.type = "button"; box.className = "box";
    box.setAttribute("aria-label", "Open " + prompt +

  const today = load().jots.filter(j => vector(j).date === key);

    ? today.length + (today.length === 1 ? " jot" : " jots") + " \u00b7 " +

/* run a DOM change inside a view transition, or plainly if the browser cannot
   do it or the person asked for less motion. Never let the animation be load
   bearing: fn() always runs either way. */
function morph(fn){
  if (!document.startViewTransition ||
      matchMedia("(prefers-reduced-motion: reduce)").matches) { fn(); return null; }
  return document.startViewTransition(fn);
}

let lastCard = null;   /* which card was tapped, so it can be morphed back */

/* ⚠⚠ NOTHING IN THIS FILE MAY WRITE A JOT ON HIS BEHALF.
   Reported 2026-08-14: "stop pantom adding jots pleaser."
   Two entries were injected into his store from chat that day. They were his
   words, but they were not TYPED, so they carry gap_s = 0 and a fabricated
   session shape - and the one thing this app measures that no other does is
   how long he pauses between thoughts. A phantom jot is a row that looks like
   evidence and is not. The capture surface only accepts what he types into it. */

/* ★ today's ENTRIES for a category - each one its own jot, oldest first.
   ⚠ Was `todaysJot` returning a single record. Under one-timestamp-one-jot a
   category holds MANY jots per day, and the pad reads all of them so he still
   writes into a continuous page even though each line files separately. */
function todaysEntries(cat){
  const t = new Date(), key = t.getFullYear()+"-"+p2(t.getMonth()+1)+"-"+p2(t.getDate());
  return load().jots
    .filter(j => j.category === cat && vector(j).date === key)
    .sort((a,b) => String(a.opened_at).localeCompare(String(b.opened_at)));
}


/* ★★ EVERY TIMESTAMPED PARAGRAPH IS EDITABLE. His ask, 2026-08-14: "each jot
   in a timestamp should be editable."

   Tapping a line lifts it back into the writing area with its own stamp, and
   committing puts it back WHERE IT WAS rather than at the bottom. Backspace on
   an empty line does the same thing to the last one, which is the keyboard
   path to the same behaviour.

   ⚠ THE STAMP NEVER MOVES. Editing a thought does not change when you had it,
   and re-stamping would quietly corrupt gap_s, the one measurement this app
   exists for. */



/* ------------------------------------------------------------ the pad ---
   ★★★ ONE contenteditable region. Rows are its children. The caret crosses
   them, so selection, cut, copy, paste and undo are all the browser's own
   and cost no code.

   ★★★ TIMESTAMPS ARE DRAWN WITH CSS ::before FROM data-t. They are not DOM
   text, so they cannot be selected, cannot be caret-navigated into, and never
   appear in a copy. A timestamp rendered as real text would end up in every
   paste, which is exactly the "why is it copying" he hit. */
const lines = $("#lines");

function mkRow(text, ts, jid){
  const d = document.createElement("div");
  d.className = "row";
  d.dataset.ts = iso(ts);
  d.dataset.t = clk(ts);
  /* ★ the row now carries the id of the JOT it is. Without this, editing an
     existing line on reopen would save it as a new record and quietly
     duplicate his history - the exact failure the upsert exists to prevent. */
  if (jid) d.dataset.jid = jid;
  d.textContent = text || "";
  return d;
}

/* the DOM is the truth; live.paragraphs is derived from it on every keystroke */
function syncFromDom(){
  if (!live) return;
  const rows = [...lines.querySelectorAll(".row")];
  /* \u2605\u2605\u2605 PROVENANCE, added 2026-08-15 after he caught a jot he never wrote.
     `source:"typed"` is stamped HERE and only here - inside the DOM sync that
     can only run because a keystroke landed in the pad. Nothing written any
     other way can claim it. \u26a0 Absence of the field means UNKNOWN, not false:
     every paragraph captured before today has no source and must never be
     rendered as verified. */
  live.paragraphs = rows
    .map(r => ({ ts: r.dataset.ts, text: r.textContent.replace(/\u00a0/g, " "),
                 source: "typed", jid: r.dataset.jid || null }))
    .filter(p => p.text.trim());
  saveDraft();
}

/* ⚠ Chrome's default Enter inside contenteditable makes a bare div with no
   stamp. Intercepting is not a preference: an unstamped paragraph is a
   paragraph this app cannot measure. */
lines.addEventListener("keydown", e => {
  if (e.key !== "Enter" || e.shiftKey) return;
  e.preventDefault();
  const sel = window.getSelection();
  if (!sel.rangeCount) return;
  const row = sel.anchorNode.nodeType === 1 ? sel.anchorNode : sel.anchorNode.parentElement;
  const here = row.closest(".row") || lines.lastElementChild;
  const at = sel.anchorOffset, txt = here.textContent;
  const tail = txt.slice(at);
  here.textContent = txt.slice(0, at);
  const next = mkRow(tail, new Date());
  next.classList.add("fresh");
  here.after(next);
  const r = document.createRange();
  r.setStart(next.firstChild || next, 0); r.collapse(true);
  sel.removeAllRanges(); sel.addRange(r);
  next.scrollIntoView({block:"nearest"});
  syncFromDom();
});

lines.addEventListener("input", () => {
  /* a paste or a delete can leave bare divs or text nodes; re-home them */
  [...lines.childNodes].forEach(n => {
    if (n.nodeType === 3 && n.textContent.trim()){
      const d = mkRow(n.textContent, new Date()); n.replaceWith(d);
    } else if (n.nodeType === 1 && !n.classList.contains("row")){
      const d = mkRow(n.textContent, new Date()); n.replaceWith(d);
    }
  });
  if (!lines.querySelector(".row")) lines.append(mkRow("", new Date()));
  syncFromDom();
});

/* ★ paste arrives as plain text, always. A pasted <b> or a colour from another
   app would be the one thing that makes this stop looking like paper. */
lines.addEventListener("paste", e => {
  e.preventDefault();
  const txt = (e.clipboardData || window.clipboardData).getData("text/plain");
  const parts = txt.split(/\r?\n/).filter(x => x.length);
  const sel = window.getSelection();
  if (!sel.rangeCount || !parts.length) return;
  const row = (sel.anchorNode.nodeType === 1 ? sel.anchorNode : sel.anchorNode.parentElement).closest(".row");
  if (!row) return;
  const at = sel.anchorOffset, txt0 = row.textContent;
  row.textContent = txt0.slice(0, at) + parts[0];
  let cur = row;
  for (const p of parts.slice(1)){ const n = mkRow(p, new Date()); cur.after(n); cur = n; }
  cur.textContent += txt0.slice(at);
  const r = document.createRange();
  r.setStart(cur.firstChild || cur, cur.textContent.length - txt0.slice(at).length);
  r.collapse(true); sel.removeAllRanges(); sel.addRange(r);
  syncFromDom();
});

function drawLines(){
  lines.innerHTML = "";
  for (const p of (live ? live.paragraphs : []))
    lines.append(mkRow(p.text, new Date(p.ts), p.jid));
  lines.append(mkRow("", new Date()));
}

function focusEnd(){
  const last = lines.lastElementChild; if (!last) return;
  const r = document.createRange(), sel = window.getSelection();
  r.selectNodeContents(last); r.collapse(false);
  sel.removeAllRanges(); sel.addRange(r);
  lines.focus(); lines.scrollTop = lines.scrollHeight;
}

function openPad(cat, cardEl){
  const now = new Date();

  /* ★★★ A JOT IS CONTINUOUS. His spec: "when loose is clicked again you can
     see the prior notes in the notepad with time stamps ... a jot can have
     multiple time stamps based on next times."

     So reopening a category RESUMES today's jot instead of starting a new one.
     Open it at 9am and again at 4pm and it is the same page, the morning still
     on it, a fresh line at the bottom.

     ★★ This is the right model and not just his preference: gap_s, the number
     this whole app exists to capture, is only meaningful WITHIN a jot. Under
     the old one-jot-per-tap model a seven hour gap between two thoughts was
     two unrelated rows and the interval was simply lost. Now it is one row and
     the interval is data. */
  /* the pad is a VIEW over today's entries for this category, not a single
     record. Writing stays continuous; storage stays atomic. */
  const prior = todaysEntries(cat);
  live = {
    category: cat, prompt_text: promptFor(cat), _open: now,
    _resumed: prior.length > 0,
    paragraphs: prior.map(j => ({
      ts: j.opened_at,
      text: (j.paragraphs[0] || {}).text || "",
      source: (j.paragraphs[0] || {}).source,
      jid: j.jot_id
    }))
  };

  lastCard = cardEl || null;
  if (lastCard){
    lastCard.style.viewTransitionName = "pane";
    const q = lastCard.querySelector(".q");
    if (q) q.style.viewTransitionName = "promptline";
  }
  const vt = morph(() => { home.style.display="none"; pad.classList.add("on"); });
  const clear = () => { if (!lastCard) return;
    lastCard.style.viewTransitionName = "";
    const q = lastCard.querySelector(".q"); if (q) q.style.viewTransitionName = ""; };
  vt ? vt.finished.then(clear, clear) : clear();

  $("#pcat").textContent = label(cat);
  $("#pq").textContent = promptFor(cat);
  drawLines();

  /* ★ the nudge only appears on a genuinely blank page. Coming back to a jot
     with your own words on it and being told to "start jotting" is the app
     failing to notice you already did. */
  /* ★ anything unsaved from last time comes back, including the half typed
     line. This is the whole point of the draft. */
  const d = readDraft(cat);
  if (d && d.paragraphs.length >= live.paragraphs.length){
    live.paragraphs = d.paragraphs;
    drawLines();
  }

  /* ★★★ COMPOSE AT THE TOP, HISTORY ABOVE. His spec 2026-08-15:
     "when i click on a jot - i need it to be timestamp and starting to jot
      from the top of page. then if i were to scroll up i could see past jots."

     So opening a jot always lands on a FRESH STAMPED EMPTY LINE, and that line
     is scrolled to the TOP of the screen with everything he wrote before it
     sitting above, reachable by scrolling up.

     ⚠ This is the difference between a notes app and a capture tool. Landing
     at the bottom of yesterday's paragraph means reading before writing; the
     thought he opened the app to catch is already leaking while he scrolls.

     ⚠⚠ AN EMPTY ROW IS NOT A PHANTOM JOT. syncFromDom filters on
     `p.text.trim()`, so a line he never types into is never persisted and
     never carries a stamp into the record. */
  const rows0 = [...lines.querySelectorAll(".row")];
  const tail = rows0[rows0.length - 1];
  if (!tail || tail.textContent.trim()) lines.append(mkRow("", new Date()));

  setTimeout(() => {
    focusEnd();
    composeToTop();
  }, 60);
}

/* put the line he is about to type on at the TOP of the visible area.
   ⚠ Only works because #lines carries a tall bottom padding - without it the
   last row cannot be scrolled any higher than the bottom of the box. */
function composeToTop(){
  const rows = [...lines.querySelectorAll(".row")];
  const last = rows[rows.length - 1];
  if (!last) return;
  /* #app now has a definite viewport height, so #lines owns the normal scroll
     range on touch and desktop. Keep the fallback for older engines that may
     still size a contenteditable flex child against its content. */
  if (lines.scrollHeight > lines.clientHeight + 4){
    lines.scrollTop = Math.max(0, last.offsetTop - 6);
  } else {
    const y = last.getBoundingClientRect().top + window.scrollY
              - (document.querySelector("#padtop")?.getBoundingClientRect().bottom || 0) - 6;
    window.scrollTo({ top: Math.max(0, y), behavior: "instant" in window ? "instant" : "auto" });
  }
}

/* ★ TAP RAISES THE CONTROLS, and typing puts them away again.
   ⚠ A bar that stays up while he writes would sit on the sentence - which is
   the exact clipping he screenshotted. So: a tap shows it, a keystroke hides
   it. The gesture that asks for it is not the gesture that needs the space. */
(function padControls(){
  const bar = $("#padbar");
  if (!bar) return;
  const show = () => bar.classList.add("up");
  const hide = () => bar.classList.remove("up");

  lines.addEventListener("click", () => bar.classList.toggle("up"));
  lines.addEventListener("keydown", hide);
  lines.addEventListener("scroll", hide, { passive: true });

  $("#pbTop").addEventListener("click", e => {
    e.preventDefault();
    composeToTop(); focusEnd(); hide();
  });
})();

/* Native scrollbars make the ruled sheet read like a boxed editor. Keep
   wheel, trackpad, keyboard, and touch scrolling native, then expose the two
   useful destinations as a small Codex-like edge control. */
(function scrollPositionNav(){
  const rail = $("#scrollrail");
  const first = $("#jumpFirst");
  const latest = $("#jumpLatest");
  if (!rail || !first || !latest) return;

  const refresh = () => {
    const overflow = lines.scrollHeight > lines.clientHeight + 4;
    const end = Math.max(0, lines.scrollHeight - lines.clientHeight);
    rail.classList.toggle("ready", overflow);
    first.disabled = !overflow || lines.scrollTop <= 4;
    latest.disabled = !overflow || lines.scrollTop >= end - 4;
  };

  first.addEventListener("click", () => lines.scrollTo({ top:0, behavior:"smooth" }));
  latest.addEventListener("click", () => composeToTop());
  lines.addEventListener("scroll", refresh, { passive:true });
  lines.addEventListener("input", refresh);
  window.addEventListener("resize", refresh, { passive:true });
  new MutationObserver(refresh).observe(lines, {
    childList:true,subtree:true,characterData:true
  });
  if ("ResizeObserver" in window) new ResizeObserver(refresh).observe(lines);
  requestAnimationFrame(refresh);
})();


/* ★ DONE is the one explicit exit. The top-left plus was a duplicate save
   control that crowded the prompt; removing it leaves the capture question
   clear and keeps one unmistakable completion action. */
/* ⚠⚠ ONE SAVE PATH. The old handler always PUSHED, which
   was correct when every tap made a new jot. Now that reopening a category
   RESUMES today's jot, pushing would write a second row with the same id and
   the day would silently double. Upsert by jot_id, not append. */
function saveAndHome(){
  syncFromDom();
  if (live && live.paragraphs.length){
    const st = load();
    /* ★★ ONE ROW, ONE JOT. Each line is upserted as its own record: a row that
       already carries a jid updates in place, a new row becomes a new jot.
       ⚠ Rows he DELETED in the pad are removed too - they were entries of this
       category and day and are no longer on screen, so leaving them behind
       would resurrect text he just erased. Scoped to today+category ONLY;
       nothing outside the page he was looking at is ever touched. */
    const key = vector({ opened_at: iso(live._open || new Date()) }).date;
    const keptIds = new Set(live.paragraphs.map(p => p.jid).filter(Boolean));
    for (let i = st.jots.length - 1; i >= 0; i--){
      const j = st.jots[i];
      if (j.category === live.category && vector(j).date === key
          && !keptIds.has(j.jot_id)) st.jots.splice(i, 1);
    }
    for (const p of live.paragraphs){
      const rec = {
        jot_id: p.jid || uid(),
        category: live.category,
        prompt_text: live.prompt_text,
        opened_at: p.ts,
        closed_at: p.ts,
        source: "typed",
        paragraphs: [{ ts: p.ts, text: p.text, source: p.source || "typed" }]
      };
      const i = st.jots.findIndex(j => j.jot_id === rec.jot_id);
      if (i >= 0) st.jots[i] = { ...st.jots[i], ...rec }; else st.jots.push(rec);
    }
    save(st);
  }
  clearDraft();
  renderHome();
}

/* ★★★ AUTOSAVE. A CAPTURE TOOL THAT LOSES WHAT YOU TYPED IS BROKEN.
   Earned the hard way 2026-08-14: a page reload during testing destroyed a
   real entry the user had typed and not yet committed. The words were on screen
   and then they were not.

   ⚠ The old model only wrote to storage on save, so everything between the
   first keystroke and the check mark lived in a variable. A reload, a crash, a
   phone killing the tab in the background, or a mistyped test all ate it.

   Now every keystroke and every committed paragraph writes a draft, and
   opening a category restores it. The draft is cleared the moment the jot
   itself is saved, so it can never resurrect old text over new. */
const DRAFT = "jot.draft";
const saveDraft = () => {
  if (!live) return;
  localStorage.setItem(DRAFT, JSON.stringify({
    cat: live.category, jot_id: live.jot_id,
    /* ⚠ no separate `typing` field any more. In the textarea model the
       half typed line lived outside live.paragraphs and had to be saved
       alongside it. Now every row IS a paragraph the moment it exists, so
       the draft is just the paragraphs and there is nothing to lose. */
    paragraphs: live.paragraphs,
    at: iso(new Date())
  }));
};
const clearDraft = () => localStorage.removeItem(DRAFT);
const readDraft = cat => {
  try {
    const d = JSON.parse(localStorage.getItem(DRAFT) || "null");
    return d && d.cat === cat ? d : null;
  } catch { return null; }
};
window.addEventListener("beforeunload", saveDraft);
document.addEventListener("visibilitychange", () => { if (document.hidden) saveDraft(); });

$("#done").addEventListener("click", saveAndHome);

/* ★★ BACKSPACE ON AN EMPTY LINE PULLS THE LAST PARAGRAPH BACK UP.
   His ask, 2026-08-14: "when i backspace it should allow me to go back to last
   jot it needs to be seemless."

   A real notepad has no notion of a committed line. Enter making a paragraph
   permanent means a typo one keystroke old needs the mouse, the library, and a
   delete. Backspace on an empty line un-commits instead: the paragraph comes
   back into the textarea with the caret at its end, ready to keep typing.

   ⚠ THE TIMESTAMP COMES BACK WITH IT. Re-committing restores the ORIGINAL
   stamp rather than stamping it now, because the thought happened when it
   happened. Re-stamping would quietly corrupt gap_s, which is the one number
   this app exists to measure. */


/* ------------------------------------------------------------- library --- */
function words(j){ return j.paragraphs.reduce((a,p) =>
  a + p.text.trim().split(/\s+/).filter(Boolean).length, 0); }

/* ---------------------------------------------------------------- the views ---
   ★★★ His spec, 2026-08-14, in one line: "user creates jots - jots can be seen
   visually and represented well for visibility - user gets to see analysis or
   conduct analysis further." CAPTURE -> SEE -> ANALYSE. The middle stage was
   the gap and this is it.

   ★★ EVERY VIEW HERE IS FREE. Nothing new is stored. The schema he designed
   this morning already writes category plus nine time buckets at insert, so a
   "view" is only a GROUP BY over columns that already exist. That is the whole
   payoff of storing derived columns instead of computing them at read time.

   ★ THE GRAPH AND THE LIST ARE THE SAME OBJECT. A chart sitting above a list
   would draw the same numbers twice and cost a phone screen of height. Instead
   every group header IS its own bar, so what he reads and what he taps are one
   thing. */

/* ★ one label function per level of the address. Each returns what a person
   would say out loud, never the stored key. */
const MONNAME = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
const lvlLabel = {
  year:  v => String(v.year),
  month: v => `${MONNAME[+v.month.slice(5,7)-1]} ${v.year}`,
  week:  v => {
    /* the ISO week as a human range: "WEEK 33 · AUG 10 to 16" */
    const d = new Date(v.date + "T12:00:00");
    const mon = new Date(d); mon.setDate(d.getDate() - ((d.getDay() + 6) % 7));
    const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
    const a = `${MONNAME[mon.getMonth()]} ${mon.getDate()}`;
    const b = mon.getMonth() === sun.getMonth()
            ? String(sun.getDate())
            : `${MONNAME[sun.getMonth()]} ${sun.getDate()}`;
    return `${v.week.slice(5).replace("W","WEEK ")} \u00b7 ${a} to ${b}`;
  },
  day:   v => dayLabel(v),
};
/* the sort key per level, kept separate from the label because "AUG 2026"
   sorts alphabetically and would put APR before JAN */
const lvlKey = { year: v => String(v.year), month: v => v.month,
                 week: v => v.week, day: v => v.date };
const CHAIN = ["year","month","week","day"];

/* ⚠ TIME ONLY now. category and day part left this list because they are not
   granularities of time, they are filters, and having them here is what made
   the whole thing a mode switch. */
const GROUPINGS = {
  day:   { label:"DAY",   level:"day"   },
  week:  { label:"WEEK",  level:"week"  },
  month: { label:"MONTH", level:"month" },
  year:  { label:"YEAR",  level:"year"  },
};
/* ★ three independent axes. `group` is the time granularity; `cat` and `part`
   are filters, both defaulting to "all" so the library opens unfiltered. */
/* ⚠ `open`, not `shut`. With a shut-set, absent meant OPEN and "default
   collapsed except today" could not be expressed at all. `seeded` tracks
   whether the current chain has been planted for this grouping yet. */
let libView = { group:"day", cat:"all", part:"all", q:"",
                open:new Set(), seeded:null, groupAuto:true,
                sections:libraryInitialSections(false) };

/* ★★★ THE DEFAULT GROUPING IS DERIVED FROM THE CORPUS, NOT HARD CODED.
   `group:"day"` above is only the seed for an empty store; autoGroup() replaces
   it on every open until he picks a level himself.

   ⚠⚠ WHY THIS EXISTS — it is the top finding of the 2026-08-16 multi-year
   simulation, and it is a defect that CANNOT be seen at his current size.
   Every grouping level already existed and worked. The default was simply
   chosen when the store held 31 jots, where "day" gives 3 rows. Measured
   against a simulated 3-year corpus (9,317 jots / 939 active days), the same
   default gives:

       day    939 rows · 12,417 DOM nodes · 157ms · 84.6 SCREENS of scroll
       week   157 rows ·  2,304 nodes     ·  87ms · 14.7 screens
       month   37 rows ·    784 nodes     ·  74ms ·  4.2 screens
       year     4 rows ·    460 nodes     · 120ms ·  1.9 screens

   ★ Month is 20x less scrolling AND the fastest render. The reason day is
   slowest despite being "simplest" is that it builds the most nodes.

   ⚠ The rule picks the FINEST level that stays under MAXROWS, so it degrades
   one step at a time as he writes more: day -> week -> month -> year. It never
   coarsens further than it has to, because a finer level shows more of his
   actual writing per tap.

   ★★ NOTHING CHANGES FOR HIM TODAY. With 3 active days, "day" is 3 rows and
   stays selected. This only fires once a level stops fitting. */
const MAXROWS = 40;   /* ~4 screens of headers before a level is unusable */

function autoGroup(jots){
  if (!jots.length) return "day";
  /* count DISTINCT keys per level - the row count is the cost, not the jot
     count. 9,317 jots across 37 months is 37 rows, not 9,317. */
  for (const lvl of CHAIN.slice().reverse()){        /* day, week, month, year */
    const seen = new Set();
    for (const j of jots) seen.add(lvlKey[lvl](vector(j)));
    if (seen.size <= MAXROWS) return lvl;
  }
  return "year";
}

/* ★ the path to TODAY at the showing level, derived not hard coded */
function currentChain(rootLevel){
  const v = vector({ opened_at: iso(new Date()) });
  const out = [];
  let p = rootLevel;
  for (let i = CHAIN.indexOf(rootLevel); i < CHAIN.length; i++){
    p += "/" + lvlKey[CHAIN[i]](v);
    out.push(p);
  }
  return out;
}

/* a jot matches if the term is anywhere a person would think to look for it */
/* ★★ prompt_text is DELIBERATELY NOT SEARCHED. It is a historical snapshot of
   the prompt as worded on the day, which is the right thing to STORE and the
   wrong thing to MATCH on.

   Measured in his own store 2026-08-16: `food` holds two spellings
   ("What did you just eat?" and "what did you just eat"), `plus` holds two,
   and `social` still carries 'how did you feel after talking to:' - a prompt
   that no longer exists in the app at all.

   ⚠ So searching "eat" hit SOME of his food jots and not others, purely by
   which wording was current the day he wrote. A search whose results depend on
   app history rather than on his words is worse than one that misses: it looks
   complete and is not. `category` already covers the intent. */
const hits = (j, q) => !q || (
  j.paragraphs.some(p => p.text.toLowerCase().includes(q)) ||
  j.category.toLowerCase().includes(q));

/* LIBRARY_SHOWCASE_PURE_START */
function libraryInitialSections(demo=false){
  return { profile:!!demo, transfer:false, archive:false, options:false,
           search:!!demo, patterns:true };
}

function librarySectionOpen(key, saved, defaultOpen=false){
  return Object.prototype.hasOwnProperty.call(saved, key) ? saved[key] : defaultOpen;
}

function libraryTimelineHeading(demo, total){
  if (!demo) return null;
  return {
    title:"ALL JOTS",
    meta:`${total.toLocaleString("en-US")} FICTIONAL ${total === 1 ? "JOT" : "JOTS"}`
  };
}
/* LIBRARY_SHOWCASE_PURE_END */

function createLibrarySection(label, sub, key, defaultOpen=false){
  const details = document.createElement("details");
  details.className = "libsection";
  details.open = librarySectionOpen(key, libView.sections, defaultOpen);
  const summary = document.createElement("summary");
